<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>段落与 IME 浏览器回归</title>
<style>
body { margin: 0; font: 14px/1.5 system-ui; }
#result { position: fixed; inset: 0 0 auto; z-index: 20; background: white; }
#host { margin: 70px 30px; height: 600px; overflow: auto; }
</style>
<pre id="result">正在验证…</pre><div id="host"></div><div id="second"></div>
<script type="module">
import { buildLayoutIndex } from '@uw/layout';
import { UltimateWord } from 'ultimate-word';
import fixtureUrl from '../../fidelity/fixtures/gongwen-01.docx?url';

const result = document.querySelector('#result');
const host = document.querySelector('#host');
let passed = 0;
function assert(value, label) { if (!value) throw new Error(label); passed++; }
const frame = () => new Promise(requestAnimationFrame);
try {
  const doc = await UltimateWord.load(fixtureUrl);
  const view = doc.mount(host, { mode: 'edit' });
  const preview = doc.mount('#second');
  const range = doc.rangeOf(doc.query('paragraph')[0]);
  view.select({ start: range.start, end: range.start }); view.focus();
  await frame();
  const input = host.querySelector('textarea');
  assert(input === document.activeElement, '编辑输入获得焦点');
  const before = (type, data) => input.dispatchEvent(new InputEvent('beforeinput', { inputType: type, data, bubbles: true, cancelable: true }));
  before('insertText', '测试');
  assert(doc.find('测试').length === 1, '输入提交到模型与查找');
  assert(input === host.querySelector('textarea') && document.activeElement === input, '重排保留输入节点与焦点');
  assert(preview.root.textContent.includes('测试'), '同一文档的预览视图同步重排');
  input.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  input.value = '中文';
  input.dispatchEvent(new InputEvent('beforeinput', { inputType: 'insertCompositionText', data: '中文', isComposing: true, bubbles: true }));
  assert(doc.find('测试中文').length === 0, '组合期不写模型');
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', isComposing: true, bubbles: true, cancelable: true }));
  input.dispatchEvent(new CompositionEvent('compositionend', { data: '中文', bubbles: true }));
  before('insertText', '中文');
  assert(doc.find('测试中文').length === 1 && doc.find('中文中文').length === 0, 'IME 提交一次，尾随输入不重复');
  const count = doc.query('paragraph').length;
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
  assert(doc.query('paragraph').length === count + 1, 'Enter 拆段');
  assert(view.caretRect(view.selection.end) !== null, '拆段后光标可定位');
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Backspace', bubbles: true, cancelable: true }));
  assert(doc.query('paragraph').length === count, '段首退格合段');
  doc.undo(); assert(doc.query('paragraph').length === count + 1, '撤销恢复段落结构');
  doc.undo(); doc.undo();
  assert(doc.find('测试中文').length === 0 && doc.find('测试').length === 1, '组合输入独立撤销');
  doc.redo(); assert(doc.find('测试中文').length === 1, '重做恢复组合结果');
  const at = doc.rangeOf(doc.query('paragraph')[0]).start;
  doc.tx((tx) => { tx.splitParagraph(at); });
  const empty = doc.rangeOf(doc.query('paragraph')[0]);
  view.select(empty); view.focus(); await frame();
  const rect = view.caretRect(empty.start);
  assert(rect !== null && rect.height > 0, '空段落有光标行高');
  const located = view.locate({ clientX: rect.x + 2, clientY: rect.y + rect.height / 2 });
  assert(located?.nodeId === empty.start.nodeId, '点击空段落命中插入点');
  view.setZoom(1.25); await frame();
  const zoomed = view.caretRect(empty.start);
  assert(Math.abs(parseFloat(input.style.left) - zoomed.x) < 1, '缩放更新输入候选位置');
  input.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  input.blur();
  input.dispatchEvent(new CompositionEvent('compositionend', { data: '取消', bubbles: true }));
  assert(doc.find('取消').length === 0, '失焦取消未提交组合');
  view.select(empty); view.focus();
  before('insertText', 'hello 世界 😀');
  const words = doc.find('hello 世界 😀')[0];
  const position = (offset) => ({ ...words.start, offset: words.start.offset + offset });
  const key = (key, modifiers = {}) => {
    const event = new KeyboardEvent('keydown', { key, ...modifiers, bubbles: true, cancelable: true });
    input.dispatchEvent(event);
    return event.defaultPrevented;
  };
  view.select({ start: position(0), end: position(0) });
  assert(key('ArrowRight', { ctrlKey: true }) && view.selection.end.offset === position(5).offset, 'Ctrl 右键按词移动');
  key('ArrowRight', { altKey: true });
  assert(view.selection.end.offset === position(8).offset, 'Option 右键按中文词移动');
  key('ArrowLeft', { ctrlKey: true, shiftKey: true });
  assert(view.selection.start.offset === position(6).offset && view.selection.end.offset === position(8).offset, 'Ctrl Shift 左键反向选词');
  const activeCaret = view.caretRect(position(6));
  assert(Math.abs(parseFloat(input.style.left) - activeCaret.x) < 1, '反向选区的输入节点跟随移动端');
  key('ArrowRight', { ctrlKey: true, shiftKey: true });
  assert(view.selection.start.offset === view.selection.end.offset, 'Shift 返回锚点折叠选区');
  assert(!key('ArrowLeft', { ctrlKey: true, altKey: true }), '不拦截 Ctrl Alt 组合键');
  const wordCaret = view.caretRect(position(7));
  const point = { clientX: wordCaret.x + 1, clientY: wordCaret.y + wordCaret.height / 2 };
  const hit = document.elementFromPoint(point.clientX, point.clientY);
  hit.dispatchEvent(new MouseEvent('dblclick', { ...point, button: 0, bubbles: true, cancelable: true }));
  assert(view.selection.start.offset === position(6).offset && view.selection.end.offset === position(8).offset, '双击中文词选中完整范围');
  const wordEnd = view.caretRect(position(8));
  const rightHalf = { clientX: wordEnd.x - 1, clientY: wordEnd.y + wordEnd.height / 2 };
  document.elementFromPoint(rightHalf.clientX, rightHalf.clientY).dispatchEvent(new MouseEvent('dblclick', { ...rightHalf, button: 0, bubbles: true, cancelable: true }));
  assert(view.selection.start.offset === position(6).offset && view.selection.end.offset === position(8).offset, '双击末字右半边仍选当前词');
  before('insertText', '地球');
  assert(doc.find('hello 地球 😀').length === 1, '双击选词后输入替换该词');
  doc.undo();
  assert(doc.find('hello 世界 😀').length === 1, '词替换一次撤销恢复');
  view.select({ start: position(8), end: position(8) });
  assert(key('Backspace', { ctrlKey: true }) && doc.find('hello  😀').length === 1, 'Ctrl Backspace 删除完整中文词');
  assert(doc.compare(view.selection.end, position(6)) === 0 && input === document.activeElement, '按词删除后光标回到删除起点且保持焦点');
  assert(preview.root.textContent.includes('hello  😀'), '按词删除同步更新预览视图');
  key('z', { ctrlKey: true });
  assert(doc.find('hello 世界 😀').length === 1, '按词删除一次撤销恢复');
  key('z', { ctrlKey: true, shiftKey: true });
  assert(doc.find('hello  😀').length === 1, '按词删除支持重做');
  doc.undo();
  view.select({ start: position(0), end: position(0) });
  assert(key('Delete', { ctrlKey: true }) && doc.find(' 世界 😀').length === 1 && doc.find('hello').length === 0, 'Ctrl Delete 向前删除整词');
  doc.undo();
  view.select({ start: position(11), end: position(11) });
  assert(key('Backspace', { altKey: true }) && doc.find('hello 世界 ').length === 1 && doc.find('😀').length === 0, 'Option Backspace 整体删除 emoji');
  doc.undo();
  view.select({ start: position(5), end: position(5) });
  assert(key('Delete', { altKey: true }) && doc.find('hello 😀').length === 1, 'Option Delete 删除空白及下一个词');
  doc.undo();
  view.select({ start: position(8), end: position(8) });
  before('deleteWordBackward');
  assert(doc.find('hello  😀').length === 1, 'beforeinput 向后按词删除');
  doc.undo();
  view.select({ start: position(0), end: position(0) });
  before('deleteWordForward');
  assert(doc.find('hello').length === 0, 'beforeinput 向前按词删除');
  doc.undo();
  view.select({ start: position(4), end: position(1) });
  key('Backspace', { ctrlKey: true });
  assert(doc.find('ho 世界 😀').length === 1, '按词删除已有反向选区时只删选中部分');
  doc.undo();
  view.select({ start: position(8), end: position(8) });
  assert(!key('Backspace', { ctrlKey: true, altKey: true }) && !key('Delete', { metaKey: true }), '不接管 Ctrl Alt 或 Cmd 删除快捷键');
  input.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  const protectedSelection = JSON.stringify(view.selection);
  assert(!key('Backspace', { ctrlKey: true }) && !key('Delete', { altKey: true }), 'IME 组合期间不拦截按词删除键');
  before('deleteWordBackward'); before('deleteWordForward');
  assert(doc.find('hello 世界 😀').length === 1 && JSON.stringify(view.selection) === protectedSelection, 'IME 组合期间按词删除事件不改模型或选区');
  input.blur(); view.focus();
  view.select({ start: position(0), end: position(0) });
  before('insertText', ['一二三四五六七八九十', '短', '甲乙丙丁戊己庚辛壬癸', ...Array(60).fill('跨页导航测试正文'), ''].join('\n'));
  let index = buildLayoutIndex(doc.layout);
  const long = doc.find('一二三四五六七八九十')[0];
  const third = doc.find('甲乙丙丁戊己庚辛壬癸')[0];
  const longAt = { ...long.start, offset: long.start.offset + 7 };
  const thirdAt = { ...third.start, offset: third.start.offset + 7 };
  view.select({ start: longAt, end: longAt }); view.focus();
  key('ArrowDown'); key('ArrowDown');
  assert(doc.compare(view.selection.end, thirdAt) === 0, '经过短行后恢复原横向位置');
  key('ArrowUp'); view.setZoom(0.8); await frame(); key('ArrowUp');
  assert(doc.compare(view.selection.end, longAt) === 0, '缩放后连续上下键仍保留布局横坐标');
  key('ArrowDown'); key('ArrowLeft'); key('ArrowDown');
  assert(doc.compare(view.selection.end, thirdAt) !== 0, '左右键清除上下导航的横向记忆');
  view.select({ start: longAt, end: longAt });
  key('ArrowDown', { shiftKey: true }); key('ArrowDown', { shiftKey: true });
  assert(doc.compare(view.selection.start, longAt) === 0 && doc.compare(view.selection.end, thirdAt) === 0, 'Shift 下键跨短行扩选并保留锚点');
  key('ArrowUp', { shiftKey: true }); key('ArrowUp', { shiftKey: true });
  assert(doc.compare(view.selection.start, view.selection.end) === 0, 'Shift 上键回到锚点折叠');
  const bodyLines = index.lines.filter((line) => !line.frame && !line.repeated && line.line.fragments.some((f) => f.offset >= 0));
  const page0 = bodyLines[0].page;
  const last = bodyLines.filter((line) => line.page === page0).at(-1);
  const next = bodyLines.find((line) => line.page > page0);
  const tailFragment = last.line.fragments.find((f) => f.offset >= 0);
  const tail = { nodeId: tailFragment.runId, contentIndex: tailFragment.contentIndex, offset: tailFragment.offset };
  view.select({ start: tail, end: tail }); view.focus();
  key('ArrowDown', { shiftKey: true }); await frame();
  let current = index.caretRect(view.selection.end);
  assert(current.page === next.page && current.y === next.top, 'Shift 下键从页末进入下一页首行');
  assert(doc.compare(view.selection.start, tail) === 0, '跨页扩选保留原锚点');
  const visible = view.caretRect(view.selection.end);
  const hostRect = host.getBoundingClientRect();
  assert(visible.y >= hostRect.top - 1 && visible.y + visible.height <= hostRect.bottom + 1, '跨页导航滚动到移动端');
  key('ArrowUp', { shiftKey: true });
  assert(doc.compare(view.selection.start, view.selection.end) === 0, '跨页反向扩选回到锚点');
  input.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  const during = JSON.stringify(view.selection);
  assert(!key('ArrowDown') && JSON.stringify(view.selection) === during, 'IME 组合期间不拦截上下键');
  input.blur(); view.focus();
  before('insertText', '新增');
  index = buildLayoutIndex(doc.layout);
  key('ArrowDown');
  current = index.caretRect(view.selection.end);
  assert(current !== undefined && input === host.querySelector('textarea'), '编辑重排后上下导航使用新索引且输入节点常驻');
  view.dispose(); preview.dispose();
  assert(host.childElementCount === 0, '销毁清理输入与页树');
  result.textContent = `PASS ${passed} 项`;
} catch (error) { result.textContent = `FAIL ${passed} 项后\n${error.stack ?? error}`; }
</script>
</html>
