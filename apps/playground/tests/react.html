<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>@uw/react 浏览器回归</title>
<style>
body { margin: 0; font: 14px/1.5 system-ui; }
#result { position:fixed;top:0;left:0;z-index:20;background:white;margin:0; }
#app { margin: 60px 40px; }
.viewer { width: 700px; height: 500px; overflow: auto; padding: 10px; box-sizing: border-box; border: 1px solid #999; }
.bubble { background: #fff8c5; border: 1px solid #d4a72c; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
</style>
<pre id="result">正在验证…</pre><div id="app"></div>
<script type="module">
import { UltimateWordView, useDecoration, useDocument } from '@uw/react';
// Phase 6 的 DoD：在任意段落右侧挂一个 React 批注气泡，滚动 / 缩放 / 重排后位置不飘。
// 真文档 + 真视图 + 真 React；组件的接线（何时挂 / 卸）在 Vitest 里已用假视图钉死，这里只看几何
import { createRef, createElement as h, StrictMode, useEffect, useState } from 'react';
import { createRoot } from 'react-dom/client';
import { UltimateWord } from 'ultimate-word';
import fixtureUrl from '../../fidelity/fixtures/gongwen-01.docx?url';
import { revisionViewDocx } from './list-fixture.ts';

const result = document.querySelector('#result');
let passed = 0;
const assert = (condition, label) => { if (!condition) throw new Error(label); passed++; result.textContent = `进行中 ${passed}：${label}`; };
const near = (a, b, tol = 1) => Math.abs(a - b) < tol;
const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
const until = async (fn, ms = 3000) => { const t0 = performance.now(); while (!fn()) { if (performance.now() - t0 > ms) return false; await frame(); } return true; };

// 外部驱动的 props：测试脚本改这个对象再 rerender
const state = { zoom: 1, pageGap: 24, overlays: [], hit: null, view: null };
let rerender;
function Bubble({ id }) {
  const [text, setText] = useState('');
  return h('div', { className: 'bubble', 'data-bubble': id }, [
    h('span', { key: 's' }, `批注 ${id}`),
    h('input', { key: 'i', 'data-input': id, value: text, onChange: (e) => setText(e.target.value) }),
  ]);
}
function App() {
  const { doc, loading, error } = useDocument(fixtureUrl);
  const [, tick] = useState(0);
  rerender = () => tick((n) => n + 1);
  useDecoration(state.view, state.hit, { className: 'hit', style: { background: '#ffd33d55' } });
  useEffect(() => { window.__doc = doc; window.__error = error; window.__loading = loading; }, [doc, loading, error]);
  if (!doc) return h('p', null, error ? `错误：${error.message}` : '加载中…');
  return h(UltimateWordView, {
    doc, zoom: state.zoom, pageGap: state.pageGap, className: 'viewer',
    overlays: state.overlays,
    onViewChange: (v) => { state.view = v; window.__view = v; },
  });
}
const root = createRoot(document.querySelector('#app'));
try {
  root.render(h(App));
  assert(await until(() => window.__doc || window.__error, 10000), 'useDocument 加载完成');
  assert(window.__error === null, '没有错误');
  const doc = window.__doc;
  assert(await until(() => window.__view), 'onViewChange 给了视图');
  const view = window.__view;
  const viewer = document.querySelector('.viewer');
  assert(viewer.firstElementChild === view.root, '视图挂进了组件的容器');
  // ① 挂到第 3 与第 6 段右侧
  const paras = doc.query('paragraph').filter((p) => doc.rangeOf(p.id) !== undefined);
  const anchorOf = (i) => doc.rangeOf(paras[i].id).start;
  const third = Math.min(8, paras.length - 1);
  state.overlays = [
    { key: 'a', anchor: anchorOf(2), placement: 'right-of-line', render: () => h(Bubble, { id: 'a' }) },
    { key: 'b', anchor: anchorOf(5), placement: 'right-of-line', offset: { x: 12, y: 0 }, render: () => h(Bubble, { id: 'b' }) },
  ];
  rerender();
  await frame();
  const bubble = (id) => document.querySelector(`[data-bubble="${id}"]`);
  assert(await until(() => bubble('a') && bubble('b') && bubble('a').getBoundingClientRect().width > 0), '两个气泡都画出来了');
  // 位置：与锚点行同高、在锚点右边、贴在页壳内（行右边 + offset 的精确值由 /tests/annotations.html 负责）
  const check = (id, i, dx, label) => {
    const b = bubble(id).getBoundingClientRect();
    const caret = view.caretRect(anchorOf(i));
    const page = [...view.root.querySelectorAll('[data-page]')].map((el) => el.getBoundingClientRect()).find((r) => caret && r.top <= caret.y && caret.y <= r.bottom);
    assert(caret && near(b.top, caret.y, 1.5) && b.left > caret.x + caret.width && b.left <= page.right + dx + 1, `${label}：气泡 ${id} 在第 ${i + 1} 段右侧（top ${b.top.toFixed(1)} vs ${caret?.y.toFixed(1)}）`);
  };
  check('a', 2, 8, '初始');
  check('b', 5, 12, '初始（带 offset）');
  // 在气泡里打字，后面每一步都要还在
  const input = document.querySelector('[data-input="a"]');
  const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
  setter.call(input, '张三'); input.dispatchEvent(new Event('input', { bubbles: true }));
  await frame();
  assert(input.value === '张三', '气泡里能输入');
  // ② 滚动：气泡是页壳的子元素，跟着页一起动
  viewer.scrollTop = 120;
  await frame();
  check('a', 2, 8, '滚动后');
  assert(document.querySelector('[data-input="a"]') === input && input.value === '张三', '滚动后输入框与内容不变');
  // ③ 缩放：不重挂，气泡跟到新位置
  state.zoom = 1.5; rerender();
  await frame(); await frame();
  assert(window.__view === view, 'zoom 变了没有重挂');
  check('a', 2, 8, '缩放后');
  check('b', 5, 12, '缩放后');
  assert(document.querySelector('[data-input="a"]') === input && input.value === '张三', '缩放后输入框与内容不变');
  // ④ 换锚点：update()，元素不变
  state.overlays = [{ ...state.overlays[0], anchor: anchorOf(third) }, state.overlays[1]]; rerender();
  await frame();
  check('a', third, 8, '换锚点后');
  assert(document.querySelector('[data-input="a"]') === input && input.value === '张三', '换锚点后输入框与内容不变');
  // ⑤ 重排（构造选项 pageGap 变了 → 重挂）：气泡重新挂到新视图上，React 子树不动
  state.pageGap = 8; rerender();
  await frame();
  assert(await until(() => window.__view && window.__view !== view), 'pageGap 变了 → 重挂出新视图');
  const next = window.__view;
  await frame();
  const bubbleA = bubble('a').getBoundingClientRect();
  const r = next.caretRect(anchorOf(third));
  assert(near(bubbleA.top, r.y, 1.5) && bubbleA.left > r.x, `重挂后气泡跟到新视图的行上（top ${bubbleA.top.toFixed(1)} vs ${r.y.toFixed(1)}）`);
  assert(next.root.contains(input) && input.value === '张三', '重挂后输入框还是同一个、内容不丢');
  // ⑥ useDecoration：find → 高亮，切 range 就换
  const hits = doc.find('通知');
  state.hit = hits[0]; rerender();
  await frame();
  assert(next.root.querySelectorAll('.hit').length > 0, 'useDecoration 挂上了高亮');
  state.hit = null; rerender();
  await frame();
  assert(next.root.querySelectorAll('.hit').length === 0, 'range 为 null 时高亮摘掉');
  // ⑦ 摘掉一个气泡；卸载组件把一切摘干净
  state.overlays = [state.overlays[0]]; rerender();
  await frame();
  assert(bubble('b') === null && bubble('a') !== null, '摘掉 b 留下 a');
  // `?keep` 留着不卸载，肉眼看气泡
  if (location.search.includes('keep')) { result.textContent = `KEEP: ${passed} 项通过，页面留着看`; throw null; }
  root.unmount();
  await frame();
  assert(document.querySelector('#app').childElementCount === 0 && bubble('a') === null, '卸载后容器为空、气泡也没了');
  assert(window.__view === null, '卸载后 onViewChange 报了 null');
  // 加载选项同门面一致：同一来源换修订视图或默认作者，也要换成新文档。
  const optionBytes = revisionViewDocx();
  const optionsRoot = createRoot(document.querySelector('#app'));
  let optionState;
  let optionView;
  const onOptionView = view => { optionView = view; };
  function OptionsProbe({ options, source }) {
    const state = useDocument(source, options);
    useEffect(() => { optionState = state; }, [state]);
    return state.doc ? h(UltimateWordView, { doc: state.doc, className: 'viewer', onViewChange: onOptionView }) : null;
  }
  const renderOptions = (options, source = optionBytes) => optionsRoot.render(h(OptionsProbe, { options, source }));
  const loadOptions = async options => {
    const previous = optionState?.doc;
    renderOptions(options);
    assert(await until(() => optionState && !optionState.loading && optionState.doc !== previous && optionView, 10000), '加载选项变化后新文档与视图就绪');
    assert(optionState.error === null, '加载选项没有产生错误');
    return optionState.doc;
  };
  const comment = d => {
    const id = d.addComment(d.find('原文')[0], 'React 默认署名');
    return d.comments().find(item => item.id === id);
  };
  const original = await loadOptions({ revisions: 'original', author: '张三' });
  assert(original.revisionView === 'original' && original.pageCount === 2 && original.find('新增').length === 0 && original.find('删除').length === 1, 'React 首次加载采用原始修订视图与对应分页');
  assert(optionView.root.textContent.includes('删除') && !optionView.root.textContent.includes('新增') && optionView.rectsOf(original.find('删除')[0]).length > 0, '原始视图的文字层与定位对应可见修订');
  assert(comment(original).author === '张三', 'React 加载的文档新建批注使用默认作者');
  const exported = await UltimateWord.load(await original.toDocx(), { revisions: 'original' });
  assert(exported.comments()[0].author === '张三' && exported.comments()[0].initials === '张', '默认署名与首字写入 DOCX，回读后保留');
  const firstView = optionView;
  renderOptions({ revisions: 'original', author: '张三' });
  await frame(); await frame();
  assert(optionState.doc === original && optionView === firstView, '同值内联加载选项不重新加载、不重挂视图');
  const markup = await loadOptions({ revisions: 'markup', author: '张三' });
  assert(markup.revisionView === 'markup' && markup.find('新增').length === 1 && markup.find('删除').length === 1, '同来源仅改变 revisions 也重新加载并显示全部修订');
  assert(optionView !== firstView && !firstView.root.isConnected && optionView.root.textContent.includes('新增'), '选项重载后旧视图卸载，新文字层显示目标修订状态');
  assert(comment(markup).author === '张三', '仅改变修订视图仍保留默认署名');
  const renamed = await loadOptions({ revisions: 'markup', author: '李四' });
  assert(renamed.revisionView === 'markup' && comment(renamed).author === '李四' && renamed.comments().length === 1, '同来源仅改变 author 也重载，新批注不沿用旧作者与旧内容');
  const defaults = await loadOptions({});
  assert(defaults.revisionView === 'final' && defaults.pageCount === 1 && defaults.find('删除').length === 0 && defaults.find('新增').length === 1, '移除修订选项恢复最终状态与一页布局');
  assert(comment(defaults).author === undefined && !optionView.root.textContent.includes('删除'), '移除作者选项恢复默认署名，文字层不残留旧修订');
  for (const outcome of ['resolve', 'reject']) {
    const realLoad = UltimateWord.load;
    const lateDoc = await realLoad(optionBytes, { revisions: 'original', author: '迟到作者' });
    let finish;
    let pendingSignal;
    try {
      UltimateWord.load = (source, options) => options.author === '迟到作者'
        ? new Promise((resolve, reject) => { pendingSignal = options.signal; finish = () => outcome === 'resolve' ? resolve(lateDoc) : reject(new Error('迟到错误')); })
        : realLoad(source, options);
      renderOptions({ revisions: 'original', author: '迟到作者' });
      assert(await until(() => pendingSignal), '开始等待旧选项加载');
      const newest = await loadOptions({ revisions: 'markup', author: '最新作者' });
      assert(pendingSignal.aborted && newest.revisionView === 'markup' && comment(newest).author === '最新作者', '新选项取消旧加载，并使用最新修订模式与署名');
      finish();
      await frame(); await frame();
      assert(optionState.doc === newest && optionState.error === null && !optionState.loading, `旧加载迟到的 ${outcome} 不覆盖新状态`);
    } finally {
      UltimateWord.load = realLoad;
    }
  }
  // 兼容没有 AbortSignal.any 的环境：用户取消必须结束 loading，旧请求清理不能取消宿主信号。
  const anyDescriptor = Object.getOwnPropertyDescriptor(AbortSignal, 'any');
  const realLoad = UltimateWord.load;
  const requestSignals = [];
  const delayedSource = () => {
    let finish;
    const source = new Blob([optionBytes]);
    source.arrayBuffer = () => new Promise(resolve => { finish = () => resolve(new Uint8Array(optionBytes).buffer); });
    return { source, finish: () => finish(), started: () => !!finish };
  };
  try {
    Object.defineProperty(AbortSignal, 'any', { configurable: true, value: undefined });
    UltimateWord.load = (source, options) => { requestSignals.push(options.signal); return realLoad(source, options); };
    const preAborted = new AbortController();
    preAborted.abort(new Error('加载前取消'));
    renderOptions({ signal: preAborted.signal });
    assert(await until(() => optionState?.error === preAborted.signal.reason && !optionState.loading), '缺少 any 时加载前取消仍结束 loading，并保留原错误');
    assert(optionState.doc === null && optionView === null, '已取消的加载不发布文档或视图');
    const pending = delayedSource();
    const external = new AbortController();
    renderOptions({ signal: external.signal }, pending.source);
    assert(await until(pending.started), '缺少 any 时开始异步读取文档');
    const request = requestSignals.at(-1);
    external.abort(new Error('用户取消读取'));
    assert(request.aborted && request.reason === external.signal.reason, '外部取消同步转发到加载器，保留取消原因');
    pending.finish();
    assert(await until(() => optionState.error === external.signal.reason && !optionState.loading), '异步读取结束后报告取消错误，不滞留 loading');
    assert(optionState.doc === null && optionView === null, '被取消的异步读取不生成可见文档');
    const shared = new AbortController();
    const older = delayedSource();
    renderOptions({ signal: shared.signal }, older.source);
    assert(await until(older.started), '同一宿主信号下旧读取开始等待');
    const oldRequest = requestSignals.at(-1);
    const recovered = await loadOptions({ signal: shared.signal, author: '恢复作者' });
    assert(oldRequest.aborted && !shared.signal.aborted && !requestSignals.at(-1).aborted, '换来源只取消旧请求，不反向取消宿主或新请求');
    older.finish();
    await frame(); await frame();
    assert(optionState.doc === recovered && optionState.error === null && !optionState.loading, '旧读取迟到的取消错误不覆盖恢复后的文档');
    assert(optionView.root.textContent.includes('新增') && optionView.rectsOf(recovered.find('新增')[0]).length > 0, '取消后重新加载恢复文字层与定位');
    shared.abort();
    assert(!requestSignals.at(-1).aborted && optionState.doc === recovered, '加载成功后移除外部取消监听，稍后取消不影响已发布文档');
    const unfinished = delayedSource();
    const unmountController = new AbortController();
    renderOptions({ signal: unmountController.signal }, unfinished.source);
    assert(await until(unfinished.started), '卸载前异步读取仍在等待');
    const unmountedRequest = requestSignals.at(-1);
    optionsRoot.unmount();
    assert(unmountedRequest.aborted && !unmountController.signal.aborted, '卸载取消请求且保留宿主信号');
    const beforeFinish = optionState;
    unfinished.finish();
    await frame(); await frame();
    assert(optionState === beforeFinish, '卸载后的迟到读取不再发布状态');
  } finally {
    UltimateWord.load = realLoad;
    if (anyDescriptor) Object.defineProperty(AbortSignal, 'any', anyDescriptor);
    else delete AbortSignal.any;
  }
  await frame();
  assert(optionView === null && document.querySelector('#app').childElementCount === 0, '加载选项回归卸载后视图与容器清理完整');
  // mode 必须进入底层构造选项；切换只换视图，同一份可编辑文档与 React 气泡继续保留。
  const modeDoc = await UltimateWord.load(revisionViewDocx());
  const modeRoot = createRoot(document.querySelector('#app'));
  const modeRef = createRef();
  const anchor = modeDoc.find('原文')[0].start;
  const modeOverlays = [{ key: 'mode', anchor, render: () => h(Bubble, { id: 'mode' }) }];
  const modeNotices = [];
  let modeView;
  const onModeView = view => { modeView = view; modeNotices.push(view); };
  const changes = [];
  const changeSub = modeDoc.on('document:change', ({ source }) => changes.push(source));
  const renderMode = (mode, zoom = 1) => modeRoot.render(h(UltimateWordView, {
    doc: modeDoc, ref: modeRef, className: 'viewer', virtualize: false, zoom,
    overlays: modeOverlays, onViewChange: onModeView, ...(mode === undefined ? {} : { mode }),
  }));
  const type = (input, text) => input.dispatchEvent(new InputEvent('beforeinput', { inputType: 'insertText', data: text, bubbles: true, cancelable: true }));
  const key = (input, shiftKey = false) => input.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, shiftKey, bubbles: true, cancelable: true }));
  renderMode('edit');
  assert(await until(() => modeView), 'React mode=edit 挂出编辑视图');
  const editView = modeView;
  const editInput = document.querySelector('#app textarea[data-uw-input]');
  assert(editInput && document.querySelectorAll('#app textarea').length === 1 && modeRef.current === editView, '编辑模式创建唯一输入节点，ref 与回调拿到同一视图');
  assert(editView.root.querySelector('[data-text-layer="true"]') === null, '编辑模式默认关闭原生划词层');
  const selectionChanges = [];
  const selectionSub = editView.on('selection:change', range => selectionChanges.push(range));
  const firstCaret = modeDoc.find('原文')[0].end;
  editView.select({ start: firstCaret, end: firstCaret });
  editView.focus();
  assert(document.activeElement === editInput && selectionChanges.length === 1, 'React 编辑视图支持选择、聚焦与原生选区事件');
  type(editInput, 'React输入');
  assert(modeDoc.find('React输入').length === 1 && changes.join() === 'tx' && modeDoc.canUndo, 'beforeinput 提交到同一份文档，只产生一次变更');
  assert(editView.root.textContent.includes('React输入') && editView.rectsOf(modeDoc.find('React输入')[0]).length > 0, 'React 输入同步绘制与定位');
  key(editInput);
  assert(modeDoc.find('React输入').length === 0 && modeDoc.canRedo && changes.join() === 'tx,undo', 'React 编辑态键盘撤销恢复原文');
  key(editInput, true);
  assert(modeDoc.find('React输入').length === 1 && changes.join() === 'tx,undo,redo', 'React 编辑态键盘重做恢复输入');
  editInput.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  editInput.dispatchEvent(new CompositionEvent('compositionend', { data: '中文', bubbles: true }));
  assert(modeDoc.find('中文').length === 1 && changes.join() === 'tx,undo,redo,tx', 'React 组合输入只提交一次');
  const bubbleInput = document.querySelector('[data-input="mode"]');
  setter.call(bubbleInput, '备注草稿'); bubbleInput.dispatchEvent(new Event('input', { bubbles: true }));
  const selected = JSON.stringify(editView.selection);
  renderMode('edit', 1.5);
  await frame(); await frame();
  assert(modeView === editView && document.querySelector('#app textarea') === editInput && editView.zoom === 1.5, '同模式缩放保留视图与常驻输入节点');
  assert(JSON.stringify(editView.selection) === selected && changes.length === 4, '同模式重渲染不改选区、文档或历史');
  editInput.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  renderMode('preview', 1.5);
  assert(await until(() => modeView && modeView !== editView), '切换 preview 重挂成预览视图');
  assert(!editInput.isConnected && document.querySelector('#app textarea') === null && document.querySelector('#app [role="status"]') === null, '切回预览移除旧输入与编辑状态节点');
  assert(modeRef.current === modeView && modeNotices.at(-2) === null && modeNotices.at(-1) === modeView, '模式重挂更新 ref，并先通知 null 再通知新视图');
  assert(modeView.selection === undefined && modeView.root.querySelector('[data-text-layer="true"]') !== null, '预览态恢复原生划词层，不保留旧编辑选区');
  assert(document.querySelector('[data-input="mode"]') === bubbleInput && bubbleInput.value === '备注草稿' && modeView.root.contains(bubbleInput), '模式切换保留 React 气泡输入框与草稿');
  const layoutBeforeLate = modeDoc.layout;
  const clipboard = new DataTransfer();
  clipboard.setData('text/plain', '粘贴文字');
  const lateEvents = [
    new CompositionEvent('compositionend', { data: '迟到组合', bubbles: true, cancelable: true }),
    new InputEvent('beforeinput', { inputType: 'insertText', data: '旧输入', bubbles: true, cancelable: true }),
    new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true, cancelable: true }),
    ...['paste', 'copy', 'cut'].map(type => new ClipboardEvent(type, { clipboardData: clipboard, bubbles: true, cancelable: true })),
  ];
  for (const event of lateEvents) editInput.dispatchEvent(event);
  assert(changes.length === 4 && modeDoc.layout === layoutBeforeLate && modeDoc.find('迟到组合').length === 0 && modeDoc.find('旧输入').length === 0, '旧输入框迟到的输入、组合和剪贴板事件不再修改文档或历史');
  assert(lateEvents.every(event => !event.defaultPrevented) && clipboard.getData('text/plain') === '粘贴文字', '旧监听者不再接管事件或覆盖剪贴板数据');
  assert(modeDoc.find('React输入').length === 1 && modeDoc.find('中文').length === 1 && modeDoc.canUndo, '切回预览保留已提交输入与撤销历史');
  const previewView = modeView;
  renderMode('edit', 1.5);
  assert(await until(() => modeView && modeView !== previewView), '再次进入 edit 创建新编辑视图');
  const nextInput = document.querySelector('#app textarea');
  const resetStart = modeDoc.rangeOf(modeDoc.query('paragraph')[0]).start;
  assert(nextInput && nextInput !== editInput && document.querySelectorAll('#app textarea').length === 1 && modeDoc.compare(modeView.selection.start, resetStart) === 0 && modeDoc.compare(modeView.selection.end, resetStart) === 0, '重新编辑只保留一个新输入节点，光标回到文档开头');
  const insertAt = modeDoc.find('原文')[0].start;
  modeView.select({ start: insertAt, end: insertAt });
  type(nextInput, '继续编辑');
  assert(modeDoc.find('继续编辑').length === 1 && changes.length === 5, '切换后仍可输入，旧视图不会重复提交');
  key(nextInput);
  assert(modeDoc.find('继续编辑').length === 0 && modeDoc.find('React输入').length === 1 && modeDoc.find('中文').length === 1, '新会话撤销只撤销新输入，保留之前提交');
  key(nextInput, true);
  assert(modeDoc.find('继续编辑').length === 1 && changes.length === 7, '新会话重做正常，事件没有重复');
  // `?editing` 留下真实编辑状态，供截图验收；常规回归继续验证恢复默认模式与卸载。
  if (new URLSearchParams(location.search).has('editing')) {
    renderMode('edit'); await frame(); await frame();
    modeView.select(modeDoc.find('继续编辑')[0]); modeView.focus();
    result.textContent = `KEEP: ${passed} 项通过，React 编辑模式与气泡草稿`;
    throw null;
  }
  const reentered = modeView;
  renderMode(undefined, 1.5);
  assert(await until(() => modeView && modeView !== reentered), '移除 mode 恢复默认预览视图');
  assert(!nextInput.isConnected && document.querySelector('#app textarea') === null && modeDoc.find('继续编辑').length === 1 && changes.length === 7, '默认预览保留文档内容，清理新会话输入且不记历史');
  const roundtrip = await UltimateWord.load(await modeDoc.toDocx());
  assert(['React输入', '中文', '继续编辑'].every(text => roundtrip.find(text).length === 1) && roundtrip.pageCount === modeDoc.pageCount, '编辑与模式切换后的文字、分页可导出回读');
  selectionSub.dispose();
  changeSub.dispose();
  modeRoot.unmount();
  await frame();
  assert(modeRef.current === null && modeView === null && document.querySelector('#app').childElementCount === 0, '模式回归卸载后 ref、视图、编辑节点与气泡全部清理');
  // 构造选项与气泡经常在同一次 React 渲染更新，不能把新气泡挂到本次刚销毁的旧视图。
  const remountDoc = await UltimateWord.load(revisionViewDocx());
  const replacementDoc = await UltimateWord.load(revisionViewDocx(), { revisions: 'original' });
  const batchRoot = createRoot(document.querySelector('#app'));
  const batchRef = createRef();
  let batchView;
  const batchNotices = [];
  const onBatchView = view => { batchView = view; batchNotices.push(view); };
  const batch = { doc: remountDoc, mode: 'preview', pageGap: 24 };
  const batchAnchor = () => batch.doc.find('原文')[0].start;
  const keptSpec = { key: 'batch-kept', anchor: batchAnchor(), render: () => h(Bubble, { id: 'batch-kept' }) };
  let batchOverlays = [keptSpec, { key: 'batch-old', anchor: batchAnchor(), render: () => h(Bubble, { id: 'batch-old' }) }];
  const renderBatch = () => batchRoot.render(h(StrictMode, null, h(UltimateWordView, {
    ...batch, ref: batchRef, className: 'viewer', virtualize: false, overlays: batchOverlays, onViewChange: onBatchView,
  })));
  renderBatch();
  assert(await until(() => batchView && document.querySelector('[data-input="batch-kept"]')), 'StrictMode 重放后视图与批注气泡就绪');
  const batchDraft = document.querySelector('[data-input="batch-kept"]');
  setter.call(batchDraft, '跨重挂草稿'); batchDraft.dispatchEvent(new Event('input', { bubbles: true }));
  await frame();
  let removedId = 'batch-old';
  for (const change of ['pageGap', 'mode', 'doc']) {
    const previous = batchView;
    const oldInput = document.querySelector('#app textarea');
    if (change === 'pageGap') batch.pageGap = 8;
    if (change === 'mode') batch.mode = 'edit';
    if (change === 'doc') batch.doc = replacementDoc;
    const addedId = `batch-${change}`;
    const offset = { x: change === 'doc' ? 12 : 0, y: 6 };
    batchOverlays = [
      { ...keptSpec, anchor: batchAnchor(), placement: 'below', offset },
      { key: addedId, anchor: batchAnchor(), render: () => h(Bubble, { id: addedId }) },
    ];
    renderBatch();
    assert(await until(() => batchView && batchView !== previous && document.querySelector(`[data-input="${addedId}"]`)), `同次修改 ${change} 与气泡可成功重挂`);
    await frame();
    assert(!previous.root.isConnected && batchRef.current === batchView && batchNotices.at(-2) === null && batchNotices.at(-1) === batchView, `${change} 重挂后清理旧视图并更新 ref 与通知`);
    assert(document.querySelector('[data-input="batch-kept"]') === batchDraft && batchDraft.value === '跨重挂草稿' && batchView.root.contains(batchDraft), `${change} 与 placement 同次更新仍保留气泡宿主与草稿`);
    assert(document.querySelector(`[data-input="${removedId}"]`) === null && batchView.root.querySelectorAll('[data-overlay]').length === 2, `${change} 重挂只保留两个目标气泡，移除旧 key`);
    const caret = batchView.caretRect(batchAnchor());
    const rect = batchDraft.closest('[data-bubble]').getBoundingClientRect();
    assert(caret && near(rect.left, caret.x + offset.x, 1.5) && near(rect.top, caret.y + caret.height + offset.y, 1.5), `${change} 重挂后 placement 与 offset 对应新文档坐标`);
    assert(document.querySelectorAll('#app textarea').length === (batch.mode === 'edit' ? 1 : 0) && !oldInput?.isConnected, `${change} 重挂后编辑输入节点数量正确，旧节点已移除`);
    removedId = addedId;
  }
  assert(batchView.root.querySelectorAll('div[data-page]').length === replacementDoc.pageCount && batchView.rectsOf(replacementDoc.find('删除')[0]).length > 0, '换 doc 后视图页数与定位来自新文档');
  batchRoot.unmount();
  await frame();
  assert(batchRef.current === null && batchView === null && !batchDraft.isConnected && document.querySelector('#app').childElementCount === 0, '同次重挂回归卸载后句柄、气泡与编辑节点清理完整');
  // 管理句柄用 Map，数字 1 与字符串 '1' 是两份身份；portal 的 key 也须保持这一点。
  const keyRoot = createRoot(document.querySelector('#app'));
  let keyView;
  const onKeyView = view => { keyView = view; };
  const keyAnchor = remountDoc.find('原文')[0].start;
  const numericSpec = { key: 1, anchor: keyAnchor, render: () => h(Bubble, { id: 'key-number' }) };
  const textualSpec = { key: '1', anchor: keyAnchor, offset: { x: 0, y: 40 }, render: () => h(Bubble, { id: 'key-string' }) };
  const renderKeys = (overlays, pageGap = 24, zoom = 1) => keyRoot.render(h(StrictMode, null, h(UltimateWordView, {
    doc: remountDoc, overlays, pageGap, zoom, className: 'viewer', onViewChange: onKeyView,
  })));
  renderKeys([numericSpec, textualSpec]);
  assert(await until(() => keyView && document.querySelector('[data-input="key-string"]')), '数字与同文字符串 key 的气泡可同时挂载');
  const numberDraft = document.querySelector('[data-input="key-number"]');
  const stringDraft = document.querySelector('[data-input="key-string"]');
  for (const [input, text] of [[numberDraft, '数字草稿'], [stringDraft, '字符串草稿']]) {
    setter.call(input, text); input.dispatchEvent(new Event('input', { bubbles: true }));
  }
  await frame();
  const originalKeyView = keyView;
  renderKeys([textualSpec, numericSpec]); await frame();
  assert(keyView === originalKeyView && keyView.root.querySelectorAll('[data-overlay]').length === 2, '两种 key 换序不重挂视图、不丢气泡');
  assert(document.querySelector('[data-input="key-number"]') === numberDraft && numberDraft.value === '数字草稿', '换序保留数字 key 的节点与独立草稿');
  assert(document.querySelector('[data-input="key-string"]') === stringDraft && stringDraft.value === '字符串草稿', '换序保留字符串 key 的节点与独立草稿');
  renderKeys([textualSpec, numericSpec], 8, 1.5);
  assert(await until(() => keyView && keyView !== originalKeyView), '两种 key 同时重挂与缩放成功');
  await frame();
  assert(keyView.root.contains(numberDraft) && keyView.root.contains(stringDraft) && numberDraft.value === '数字草稿' && stringDraft.value === '字符串草稿', '重挂后两种 key 各自保留宿主与草稿');
  const keyCaret = keyView.caretRect(keyAnchor);
  const numberRect = numberDraft.closest('[data-bubble]').getBoundingClientRect();
  const stringRect = stringDraft.closest('[data-bubble]').getBoundingClientRect();
  assert(keyCaret && near(numberRect.top, keyCaret.y, 1.5) && near(stringRect.top, keyCaret.y + 40, 1.5), '同文 key 的两个气泡分别按自己的 offset 定位');
  renderKeys([textualSpec], 8, 1.5); await frame();
  assert(!numberDraft.isConnected && keyView.root.contains(stringDraft) && stringDraft.value === '字符串草稿', '移除数字 key 只卸载对应气泡，保留字符串草稿');
  renderKeys([numericSpec, textualSpec], 8, 1.5); await frame();
  assert(document.querySelector('[data-input="key-number"]') !== numberDraft && document.querySelector('[data-input="key-number"]').value === '', '重新添加数字 key 使用新节点与空草稿');
  assert(document.querySelector('[data-input="key-string"]') === stringDraft && stringDraft.value === '字符串草稿', '重新添加同文数字 key 不影响字符串 key 的状态');
  keyRoot.unmount(); await frame();
  assert(keyView === null && !stringDraft.isConnected && document.querySelector('#app').childElementCount === 0, '混合 key 回归卸载后视图与气泡清理完整');
  result.textContent = `PASS: ${passed} react browser assertions`;
} catch (error) {
  if (error !== null) result.textContent = `FAIL after ${passed}: ${error.stack}`;
}
</script>
