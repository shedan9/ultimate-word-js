<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>富文本剪贴板浏览器回归</title>
<style>
body { margin: 0; font: 14px/1.5 system-ui; }
#result { position: fixed; inset: 0 0 auto; z-index: 20; background: white; }
#host { margin: 70px 30px; height: 600px; overflow: auto; }
</style>
<pre id="result">正在验证…</pre><div id="host"></div>
<script type="module">
import { UltimateWord } from 'ultimate-word';
import { choiceControlDocx, listDocx, templateControlsDocx } from './list-fixture.ts';

const result = document.querySelector('#result');
const host = document.querySelector('#host');
let passed = 0;
function assert(value, label) { if (!value) throw new Error(label); passed++; }
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const frame = () => new Promise(requestAnimationFrame);
function paste(input, html, plain = '') {
  const event = new Event('paste', { bubbles: true, cancelable: true });
  Object.defineProperty(event, 'clipboardData', { value: {
    getData: (type) => type === 'text/html' ? html : type === 'text/plain' ? plain : '',
  } });
  input.dispatchEvent(event);
  assert(event.defaultPrevented, '粘贴事件由编辑器处理');
}
function before(input, inputType, data = null) {
  input.dispatchEvent(new InputEvent('beforeinput', { inputType, data, bubbles: true, cancelable: true }));
}
function copyHtml(input) {
  const copied = new Map();
  const event = new Event('copy', { bubbles: true, cancelable: true });
  Object.defineProperty(event, 'clipboardData', { value: { setData: (type, value) => copied.set(type, value) } });
  input.dispatchEvent(event);
  return copied;
}
function runOf(doc, text) {
  const hit = doc.find(text)[0];
  return doc.query('paragraph').flatMap((p) => p.runs).find((r) => r.id === hit?.start.nodeId);
}
const word = `<html><head><style><!--
  @font-face {font-family:Missing;src:url(never-load.woff2);}
  @media print {p.MsoNormal {font-size:99pt;color:red;}}
  p.MsoNormal, li.MsoNormal, div.MsoNormal {
    font-size:16pt; font-family:"Times New Roman";mso-fareast-font-family:仿宋;text-align:center;
  }
  span.Strong {font-weight:bold !important;color:red;}
  p.End {font-size:14pt;font-family:仿宋;text-align:right;}
  .Number {mso-list:Ignore;} .Hidden {display:none;}
--></style></head><body><!--StartFragment-->
<p class='MsoNormal'><span class=Number>1.</span>正文2026<span class=Strong style="font-weight:normal;color:blue">强调</span><span class=Hidden>隐藏</span></p>
<p class=End>尾段</p><p></p><!--EndFragment--></body></html>`;
try {
  const doc = await UltimateWord.load(listDocx());
  const view = doc.mount(host, { mode: 'edit' });
  await frame();
  const input = host.querySelector('textarea');
  const original = doc.find('普通正文')[0];
  view.select({ start: original.end, end: original.start });
  view.focus();
  const hostStyle = document.head.appendChild(document.createElement('style'));
  hostStyle.textContent = '.MsoNormal {font-size:99pt !important;color:yellow !important;}';
  try { paste(input, word, '纯文本降级不应出现'); } finally { hostStyle.remove(); }
  assert(doc.find('正文2026').length === 1 && doc.find('强调').length === 1, '粘贴类样式中的正文');
  assert(doc.find('隐藏').length === 0 && doc.find('1.').length === 0, '类样式隐藏文字与编号占位不进入正文');
  assert(doc.find('纯文本降级不应出现').length === 0, '可解析的 HTML 优先于纯文本');
  assert(doc.query('paragraph').length === 6, '三个源段落保留段落结构');
  assert(doc.query('paragraph')[3].props.justification === 'center', 'MsoNormal 类中的段落对齐生效');
  assert(doc.query('paragraph')[4].props.justification === 'right', '第二段自己的类样式对齐生效');
  const normal = runOf(doc, '正文2026');
  assert(normal.props.size === 320, '类样式 16pt 进入模型');
  assert(normal.props.fonts.eastAsia === '仿宋', 'mso-fareast 字体不被 CSSOM 丢掉');
  assert(normal.props.fonts.ascii === 'Times New Roman', '西文字体独立保留');
  assert(normal.props.bold === false, '普通文字不继承目标的加粗');
  assert(runOf(doc, '强调').props.bold === true, '类样式 important 高于普通内联声明');
  assert(runOf(doc, '强调').props.color === '0000FF', '普通内联颜色覆盖类样式');
  assert(runOf(doc, '尾段').props.size === 280, '不同段落的字号独立');
  assert(view.rectsOf(doc.find('正文2026')[0]).length > 0, '粘贴后的文字可定位');
  const pasted = view.selection;
  before(input, 'historyUndo');
  assert(doc.query('paragraph').length === 4 && doc.find('普通正文').length === 1, '整次多段粘贴一个撤销单元');
  assert(same(view.selection, original), '撤销恢复粘贴前的选中范围');
  before(input, 'historyRedo');
  assert(same(view.selection, pasted), '重做恢复粘贴后的光标');
  assert(runOf(doc, '正文2026').props.size === 320 && runOf(doc, '强调').props.bold, '重做恢复全部类样式格式');
  assert(input === host.querySelector('textarea'), '粘贴和历史跳转保留输入节点');
  const reopened = await UltimateWord.load(await doc.toDocx());
  assert(runOf(reopened, '正文2026').props.size === 320, '导出再加载保留字号');
  assert(runOf(reopened, '正文2026').props.fonts.eastAsia === '仿宋', '导出再加载保留中文字体');
  assert(runOf(reopened, '强调').props.bold && runOf(reopened, '强调').props.color === '0000FF', '导出再加载保留强调格式');
  assert(reopened.query('paragraph')[3].props.justification === 'center', '导出再加载保留源段落对齐');

  // 复制出的规范化 HTML 再粘贴，也使用同一套读取规则。
  view.select(doc.find('正文2026')[0]);
  const copied = new Map();
  const copy = new Event('copy', { bubbles: true, cancelable: true });
  Object.defineProperty(copy, 'clipboardData', { value: { setData: (type, value) => copied.set(type, value) } });
  input.dispatchEvent(copy);
  assert(copied.get('text/html')?.includes('font-size:16pt'), '复制将类样式得到的最终格式写成内联 HTML');
  view.select(doc.find('尾段')[0]);
  paste(input, copied.get('text/html'));
  assert(doc.find('正文2026').length === 2, '规范化 HTML 可再粘贴');
  before(input, 'historyUndo');
  view.dispose();

  const webDoc = await UltimateWord.load(listDocx());
  const webView = webDoc.mount(host, { mode: 'edit' });
  const target = webDoc.find('普通正文')[0];
  webDoc.tx((t) => { t.setRunProps(target, { bold: true, size: 400, color: '008000' }); });
  webView.select({ start: target.end, end: target.end });
  const webInput = host.querySelector('textarea');
  paste(webInput, '<style>.Web {font-size:99pt;color:red;font-weight:normal;}</style><p class=Web>网页</p>');
  const web = runOf(webDoc, '网页');
  assert(web.props.size === 400 && web.props.bold && web.props.color === '008000', '普通网页类样式沿用既有合并格式策略');
  webView.dispose();

  const lockedDoc = await UltimateWord.load(choiceControlDocx());
  const lockedView = lockedDoc.mount(host, { mode: 'edit' });
  const lockedRange = lockedDoc.find('一般')[0];
  lockedView.select(lockedRange);
  const lockedInput = host.querySelector('textarea');
  paste(lockedInput, word);
  assert(lockedDoc.find('一般').length === 1 && lockedDoc.find('正文2026').length === 0, '专用填写控件仍拒绝普通富文本粘贴');
  assert(!lockedDoc.canUndo && same(lockedView.selection, lockedRange), '粘贴失败保留选区且不写历史');
  assert(host.querySelector('[role=status]').textContent.length > 0, '粘贴失败按既有路径显示错误');
  lockedView.dispose();

  // 真实复制事件必须把软换行保留为 w:br，不能丢掉或变成新段落。
  const breakDoc = await UltimateWord.load(listDocx());
  const breakView = breakDoc.mount(host, { mode: 'edit' });
  const breakInput = host.querySelector('textarea');
  const seed = breakDoc.find('普通正文')[0];
  let source;
  breakDoc.tx((tx) => {
    const start = tx.deleteRange(seed);
    let at = tx.insertInline(start, 'lineBreak');
    at = tx.insertText(at, '边界软换行');
    at = tx.insertInline(at, 'lineBreak');
    at = tx.insertInline(at, 'lineBreak');
    source = { start, end: at };
  });
  breakView.select(source);
  const breaks = copyHtml(breakInput);
  assert(breaks.get('text/plain') === '\n边界软换行\n\n', '复制纯文本保留首尾软换行');
  assert(breaks.get('text/html').includes('mso-special-character:line-break'), '复制 HTML 标记真实软换行');
  const destination = breakDoc.find('第二项')[0];
  breakView.select({ start: destination.end, end: destination.start });
  paste(breakInput, breaks.get('text/html'), breaks.get('text/plain'));
  assert(breakDoc.query('paragraph').length === 4, '含首尾软换行的粘贴不产生额外段落');
  const pastedBreaks = breakView.selection;
  const pastedParagraph = breakDoc.query('paragraph')[1];
  assert(pastedParagraph.runs.flatMap((r) => r.content).filter((c) => c.kind === 'break' && c.breakType === 'line').length === 3,
    '首尾三个软换行都落为模型片段');
  const pastedRange = breakDoc.rangeOf(pastedParagraph.id);
  breakView.select(pastedRange);
  assert(copyHtml(breakInput).get('text/plain') === breaks.get('text/plain'), '粘贴后再次复制文字与换行完全一致');
  assert(breakView.rectsOf(breakDoc.find('边界软换行')[0]).length > 0, '首行留空后正文仍可定位');
  before(breakInput, 'historyUndo');
  assert(breakDoc.find('第二项').length === 1, '首尾软换行粘贴一次撤销恢复原文');
  assert(same(breakView.selection, destination), '撤销恢复被替换的完整选区');
  before(breakInput, 'historyRedo');
  assert(same(breakView.selection, pastedBreaks), '重做恢复软换行后的光标');
  const breaksReopened = await UltimateWord.load(await breakDoc.toDocx());
  assert(breaksReopened.query('paragraph').length === 4, '导出回读不把软换行变成段落');
  assert(breaksReopened.query('paragraph')[1].runs.flatMap((r) => r.content).filter((c) => c.kind === 'break' && c.breakType === 'line').length === 3,
    '导出回读保留首尾全部软换行');
  // 只选一个换行：HTML 必须进入富文本通路，不能退回纯文本拆段。
  const breakRun = breakDoc.query('paragraph')[1].runs.find((r) => r.content.some((c) => c.kind === 'break'));
  const firstBreak = { nodeId: breakRun.id, contentIndex: breakRun.content.findIndex((c) => c.kind === 'break'), offset: 0 };
  breakView.select({ start: firstBreak, end: { ...firstBreak, offset: firstBreak.offset + 1 } });
  const loneBreak = copyHtml(breakInput);
  assert(loneBreak.get('text/plain') === '\n', '单个软换行可以独立复制');
  breakView.select(breakDoc.find('第三项')[0]);
  paste(breakInput, loneBreak.get('text/html'), loneBreak.get('text/plain'));
  assert(breakDoc.query('paragraph').length === 4, '纯软换行选区粘贴仍在原段内');
  assert(breakDoc.query('paragraph')[2].runs.flatMap((r) => r.content).some((c) => c.kind === 'break' && c.breakType === 'line'),
    '纯软换行选区粘贴产生真实软换行');
  breakView.dispose();

  const singleDoc = await UltimateWord.load(templateControlsDocx());
  const singleView = singleDoc.mount(host, { mode: 'edit' });
  const singleRange = singleDoc.find('文字字段请在编辑模式下填写')[0];
  singleView.select(singleRange);
  paste(host.querySelector('textarea'), loneBreak.get('text/html'), loneBreak.get('text/plain'));
  assert(singleDoc.find('文字字段请在编辑模式下填写').length === 1, '单行控件拒绝纯软换行粘贴且保留原文');
  assert(!singleDoc.canUndo && same(singleView.selection, singleRange), '软换行粘贴失败不改历史和选区');
  assert(host.querySelector('[role=status]').textContent.length > 0, '单行控件拒绝软换行时显示错误');
  singleView.dispose();

  // Word 的显示用空格不能代替制表位，显式首尾空格也不能被 HTML 空白规则吃掉。
  const spaceDoc = await UltimateWord.load(listDocx());
  const spaceView = spaceDoc.mount(host, { mode: 'edit' });
  const spaceInput = host.querySelector('textarea');
  const spaceTarget = spaceDoc.find('普通正文')[0];
  spaceView.select({ start: spaceTarget.end, end: spaceTarget.start });
  const wordSpaces = `<style>
    .WordTabs {mso-tab-count:2;font-weight:bold;}
    .WordSpaces {mso-spacerun:'yes';}
  </style><p class=MsoNormal><span class=WordSpaces>  </span>姓名<span class=WordTabs> &nbsp;    </span><span class=WordSpaces>甲  乙  </span></p>`;
  paste(spaceInput, wordSpaces, '不应使用纯文本');
  const expectedSpaces = '  姓名\t\t甲  乙  ';
  const spaceParagraph = spaceDoc.query('paragraph')[3];
  const spaceRange = spaceDoc.rangeOf(spaceParagraph.id);
  assert(spaceDoc.query('paragraph').length === 4, 'Word 空格与制表位粘贴不新增段落');
  assert(spaceParagraph.runs.flatMap((r) => r.content).filter((c) => c.kind === 'tab').length === 2,
    'Word tab-count 还原成两个模型制表位');
  assert(spaceParagraph.runs.filter((r) => r.content.some((c) => c.kind === 'tab')).every((r) => r.props.bold),
    '制表位保留类样式中的字符格式');
  spaceView.select(spaceRange);
  const copiedSpaces = copyHtml(spaceInput);
  assert(copiedSpaces.get('text/plain') === expectedSpaces, 'Word 首尾空格和连续空格完整进入模型');
  assert(copiedSpaces.get('text/html').includes('mso-tab-count:1'), '复制为 Word 可识别的制表位标记');
  assert(spaceView.rectsOf(spaceDoc.find('甲  乙')[0]).length > 0, '制表位后的文字可定位');
  before(spaceInput, 'historyUndo');
  assert(spaceDoc.find('普通正文').length === 1, 'Word 空白粘贴整次撤销恢复原文');
  assert(same(spaceView.selection, spaceTarget), '撤销恢复原有完整选区');
  before(spaceInput, 'historyRedo');
  spaceView.select(spaceDoc.rangeOf(spaceDoc.query('paragraph')[3].id));
  assert(copyHtml(spaceInput).get('text/plain') === expectedSpaces, '重做保留全部制表位和空格');
  const spaceReopened = await UltimateWord.load(await spaceDoc.toDocx());
  spaceView.dispose();
  const spaceReopenedView = spaceReopened.mount(host, { mode: 'edit' });
  spaceReopenedView.select(spaceReopened.rangeOf(spaceReopened.query('paragraph')[3].id));
  assert(copyHtml(host.querySelector('textarea')).get('text/plain') === expectedSpaces, 'DOCX 导出回读保留全部空白');
  assert(spaceReopened.query('paragraph')[3].runs.flatMap((r) => r.content).filter((c) => c.kind === 'tab').length === 2,
    'DOCX 回读中的制表位仍为 tab 而非空格');
  spaceReopenedView.dispose();

  const roundtripView = spaceDoc.mount(host, { mode: 'edit' });
  const roundtripInput = host.querySelector('textarea');
  roundtripView.select(spaceDoc.find('第二项')[0]);
  paste(roundtripInput, copiedSpaces.get('text/html'), copiedSpaces.get('text/plain'));
  roundtripView.select(spaceDoc.rangeOf(spaceDoc.query('paragraph')[1].id));
  assert(copyHtml(roundtripInput).get('text/plain') === expectedSpaces, '复制 HTML 再粘贴保持同样空白');
  // 纯制表位选区也必须走 HTML 通路，不能被当成无内容丢弃。
  const tabRun = spaceDoc.query('paragraph')[1].runs.find((r) => r.content.some((c) => c.kind === 'tab'));
  const tabStart = { nodeId: tabRun.id, contentIndex: tabRun.content.findIndex((c) => c.kind === 'tab'), offset: 0 };
  roundtripView.select({ start: tabStart, end: { ...tabStart, offset: 1 } });
  const loneTab = copyHtml(roundtripInput);
  assert(loneTab.get('text/plain') === '\t', '单个制表位可以独立复制');
  roundtripView.select(spaceDoc.find('第三项')[0]);
  paste(roundtripInput, loneTab.get('text/html'), loneTab.get('text/plain'));
  roundtripView.select(spaceDoc.rangeOf(spaceDoc.query('paragraph')[2].id));
  assert(copyHtml(roundtripInput).get('text/plain') === '\t', '单个制表位可以独立粘贴');
  roundtripView.dispose();

  const protectedDoc = await UltimateWord.load(choiceControlDocx());
  const protectedView = protectedDoc.mount(host, { mode: 'edit' });
  const protectedRange = protectedDoc.find('一般')[0];
  protectedView.select(protectedRange);
  paste(host.querySelector('textarea'), wordSpaces);
  assert(protectedDoc.find('一般').length === 1 && !protectedDoc.canUndo,
    'Word 空白标记仍不能绕过下拉控件输入限制');
  assert(same(protectedView.selection, protectedRange), '受保护的空白粘贴失败保留选区');
  protectedView.dispose();

  // 留一份结果用于可视验收。
  const finalView = spaceReopened.mount(host, { mode: 'edit' });
  finalView.select(spaceReopened.find('甲  乙')[0]);
  finalView.focus();
  result.textContent = `PASS ${passed} 项`;
} catch (error) { result.textContent = `FAIL ${passed} 项后\n${error.stack ?? error}`; }
</script>
</html>
