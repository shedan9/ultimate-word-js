<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>ultimate-word 门面浏览器回归</title>
<style>
body { margin: 0; font: 14px/1.5 system-ui; }
#result { position:fixed;top:0;left:0;z-index:20;background:white; }
#host { margin:60px 40px;width:700px;height:500px;overflow:auto;padding:10px;box-sizing:border-box; }
#second { margin:0 40px;width:300px;height:200px;overflow:auto; }
</style>
<pre id="result">正在验证…</pre><div id="host"></div><div id="second"></div>
<script type="module">
// 真实公文走完整条链：这里验的是门面的**接线**（fit 跟容器、dispose 摘干净、
// find → decorate → rectsOf 通到屏幕），字摆在哪由 Vitest 里的真值断言负责
import { unzip } from '@uw/ooxml';
import { UltimateWord } from 'ultimate-word';
import fixtureUrl from '../../fidelity/fixtures/gongwen-01.docx?url';
import { boundControlDocx, choiceControlDocx, controlDocx, dateControlDocx, emptyBoundaryControlDocx, emptyPlaceholderDocx, linkDocx, markRevisionControlDocx, nestedControlDocx, shellControlDocx, textStateDocx } from './list-fixture.ts';

const host = document.querySelector('#host');
const second = document.querySelector('#second');
const result = document.querySelector('#result');
let passed = 0;
const assert = (condition, label) => { if (!condition) throw new Error(label); passed++; result.textContent = `进行中 ${passed}：${label}`; };
const near = (a, b, tol = 1) => Math.abs(a - b) < tol;
const frame = async () => { if (document.hidden) return; for (let i = 0; i < 5; i++) await new Promise(requestAnimationFrame); };
// ResizeObserver 的回调是异步的，后台标签页里 rAF 不跑，只能轮询等条件
const until = async (fn, ms = 3000) => { const t0 = performance.now(); while (!fn()) { if (performance.now() - t0 > ms) return false; await new Promise((r) => setTimeout(r, 50)); } return true; };
try {
  // ① 两行：URL 来源 + 选择器目标
  const doc = await UltimateWord.load(fixtureUrl);
  assert(doc.pageCount >= 1, `load(URL) 排出 ${doc.pageCount} 页`);
  const view = doc.mount('#host');
  await frame();
  const shell = () => view.root.querySelector('[data-page="0"]');
  assert(host.firstElementChild === view.root && shell() !== null, 'mount 把根元素挂进容器');
  assert(view.zoom === 1, '默认 zoom = 1');
  // ② fit-width：页壳宽 = 容器内容盒宽 − 页间距（padding 与滚动条都要去掉）
  view.setZoom('fit-width');
  await frame();
  const inner = () => host.clientWidth - 20; // padding 10 × 2
  assert(near(shell().getBoundingClientRect().width, inner() - 24, 1.5), 'fit-width 让页宽贴住容器内容盒');
  // ③ 容器变宽，fit 跟着走（ResizeObserver）
  host.style.width = '900px';
  // ResizeObserver 只在渲染流水线里派发，后台标签页（document.hidden）永远等不到 —— 那种情况下跳过这一条
  if (!document.hidden) assert(await until(() => near(shell().getBoundingClientRect().width, inner() - 24, 1.5)), '容器变宽后 fit-width 自动重算');
  // ④ 切回数字倍率后容器再变不再跟
  view.setZoom(1);
  host.style.width = '700px';
  await until(() => host.clientWidth < 750); await frame();
  assert(view.zoom === 1 && near(shell().getBoundingClientRect().width, shell().offsetWidth, 0.5), '数字倍率不再跟随容器');
  // ⑤ fit-page：整页装得下
  view.setZoom('fit-page');
  await frame();
  const box = shell().getBoundingClientRect();
  assert(box.width <= host.clientWidth && box.height <= host.clientHeight, 'fit-page 整页装进容器');
  view.setZoom(1);
  await frame();
  // ⑥ find → decorate → rectsOf：矩形落在第一页壳里
  const hits = doc.find('通知');
  assert(hits.length > 0, `find 命中 ${hits.length} 处`);
  const mark = view.decorate(hits[0], { className: 'hit' });
  const rects = view.rectsOf(hits[0]);
  const page = shell().getBoundingClientRect();
  assert(rects.length > 0 && rects[0].x >= page.x && rects[0].x + rects[0].width <= page.right + 0.5, 'rectsOf 的矩形落在页壳里');
  assert(view.scrollTo(hits[0], { align: 'center' }) === true, 'scrollTo 命中');
  await frame();
  const pos = view.locate({ clientX: rects[0].x + 2, clientY: rects[0].y + rects[0].height / 2 });
  assert(pos !== null && doc.compare(hits[0].start, pos) <= 0 && doc.compare(pos, hits[0].end) <= 0, 'locate 反查回命中的 range 之内');
  mark.dispose();
  // ⑦ 同一份文档挂第二个视图，互不干扰
  const thumbs = doc.mount(second, { zoom: 0.2, textLayer: false });
  await frame();
  assert(second.firstElementChild === thumbs.root && view.root.isConnected, '第二个视图不影响第一个');
  thumbs.dispose();
  assert(second.childElementCount === 0, 'dispose 把第二个视图摘干净');
  // ⑧ dispose 后容器空、再 setZoom 抛
  view.dispose();
  assert(host.childElementCount === 0, 'dispose 后容器为空');
  let rejected = false; try { view.setZoom(1); } catch { rejected = true; }
  assert(rejected, '销毁后 setZoom 抛错');
  view.dispose();
  // ⑨ 结构性错误抛 UwError
  let code = '';
  try { await UltimateWord.load(new Uint8Array([1, 2, 3])); } catch (e) { code = e.code ?? ''; }
  assert(code === 'NOT_A_ZIP', '不是 zip 抛 NOT_A_ZIP');
  // ⑩ viewport:change —— 倍率变了同步报，可见页由 IntersectionObserver 异步报
  const viewed = await UltimateWord.load(fixtureUrl);
  const pv = viewed.mount('#host');
  const vp = [];
  const vpSub = pv.on('viewport:change', (e) => vp.push(e));
  pv.setZoom(0.5);
  assert(vp.at(-1)?.zoom === 0.5, 'setZoom 派发 viewport:change，带新倍率');
  const n = vp.length;
  pv.setZoom(0.5);
  assert(vp.length === n, '倍率没变不重复派发');
  if (!document.hidden) assert(await until(() => vp.some((e) => e.visiblePages.includes(0))), `可见页里有第 1 页（${JSON.stringify(vp.at(-1)?.visiblePages)}）`);
  vpSub.dispose();
  const m = vp.length;
  pv.setZoom(1);
  assert(vp.length === m, 'dispose 之后不再收到');
  pv.dispose();
  // ⑪ selection:change 与 click:element（编辑态、超链接）
  const linked = await UltimateWord.load(linkDocx());
  const ev = linked.mount('#host', { mode: 'edit' });
  await frame();
  const sels = [];
  ev.on('selection:change', (r) => sels.push(r));
  const site = linked.find('官方网站')[0];
  ev.select({ start: site.start, end: site.start });
  assert(sels.length === 1 && linked.compare(sels[0].start, site.start) === 0, 'select 派发 selection:change');
  ev.select({ start: site.start, end: site.start });
  assert(sels.length === 1, '选区按值没变不派发');
  linked.tx((t) => { t.insertText(site.start, '中'); });
  assert(sels.length === 2 && sels[1].start.offset === site.start.offset + 1, '事务映射后的光标位移也派发');
  linked.undo();
  const clicks = [];
  ev.on('click:element', (e) => clicks.push(e));
  const clickAt = (range) => {
    const r = ev.rectsOf(range)[0];
    const x = r.x + r.width / 2;
    const y = r.y + r.height / 2;
    document.elementFromPoint(x, y).dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: x, clientY: y, button: 0 }));
  };
  clickAt(linked.find('官方网站')[0]);
  assert(clicks.length === 1 && clicks[0].kind === 'hyperlink' && clicks[0].href === 'https://example.com/', `点外链：href = ${clicks[0]?.href}`);
  assert(clicks[0].node.id === clicks[0].position.nodeId && clicks[0].originalEvent instanceof MouseEvent, '事件带着 run 节点、位置与原生事件');
  clickAt(linked.find('跳到附件')[0]);
  assert(clicks.length === 2 && clicks[1].href === '#附件', `点书签链接：href = ${clicks[1]?.href}`);
  clickAt(linked.find('普通正文')[0]);
  assert(clicks.length === 2, '点普通文字不派发');
  const word = linked.find('官方网站')[0];
  ev.select(word);
  clickAt(word);
  assert(clicks.length === 2, '选区没折叠（拖选结束）时不算点击');
  ev.dispose();
  let late = false; try { ev.on('selection:change', () => {}); } catch { late = true; }
  assert(late, '销毁后 on 抛错');
  // ⑫ 内容控件：命中最内层，range 罩住全部内容，缓存跟着提交与撤销刷新
  const template = await UltimateWord.load(controlDocx());
  const tv = template.mount('#host', { virtualize: false });
  await frame();
  const controls = [];
  const controlSub = tv.on('click:element', (e) => controls.push(e));
  const fire = (range, button = 0) => {
    const rect = tv.rectsOf(range)[0] ?? tv.caretRect(range.start);
    const x = rect.x + Math.max(1, rect.width / 2);
    const y = rect.y + rect.height / 2;
    const target = document.elementFromPoint(x, y);
    target.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: x, clientY: y, button }));
  };
  const hitText = (text) => { fire(template.find(text)[0]); return controls.at(-1); };
  let hit = hitText('申请人');
  assert(hit.kind === 'contentControl' && hit.control.tag === 'applicant', '预览态点击行内坑位给控件身份');
  assert(hit.node.id === hit.position.nodeId && hit.node === template.query('run')[0] && hit.href === undefined, '控件事件仍带直接格式节点、位置与原生事件，不带 href');
  assert(template.compare(hit.range.start, template.find('申请人')[0].start) === 0 && !hit.locked, '行内坑位范围与文字范围一致');
  const beforePlain = controls.length;
  hitText('普通文字');
  assert(controls.length === beforePlain, '坑位旁边的普通文字不派发');
  hit = hitText('外层文字');
  assert(hit.control.tag === 'outer' && hit.control.scope === 'block' && hit.locked, '块级坑位从段落继承成员标记与内容锁');
  assert(template.compare(hit.range.end, template.find('内层文字')[0].end) === 0, '外层控件范围包含嵌套内层');
  hit = hitText('内层文字');
  assert(hit.control.tag === 'inner' && hit.control.parent !== undefined && hit.locked, '嵌套点选给最内层，locked 继承外层内容锁');
  hit = hitText('格内文字');
  assert(hit.control.tag === 'table' && hit.control.scope === 'block', '包整表的控件在格内文字处可点击');
  hit = hitText('无名控件');
  assert(hit.kind === 'contentControl' && hit.control.tag === undefined && hit.control.id !== undefined, '没有 tag 或 alias 的控件仍能按 id 操作');
  hit = hitText('外壳锁');
  assert(!hit.locked && hit.control.lock === 'sdtLocked', '只锁外壳仍允许填写');
  const empty = template.bindings.list().find((b) => b.key === 'empty');
  fire(empty.range);
  hit = controls.at(-1);
  assert(hit.control.tag === 'empty' && hit.node.kind === 'paragraph' && template.compare(hit.range.start, hit.range.end) === 0, '空块级控件的段落插入点可点击');
  hit = hitText('控件内链接');
  assert(hit.kind === 'hyperlink' && hit.href === '#附件', '控件内超链接优先，保留目录跳转语义');
  hit = hitText('☐');
  assert(hit.control.tag === 'agree' && hit.control.checkbox.checked === false, '复选框事件给未勾选状态');
  template.tx((t) => { t.setContentControlChecked(hit.control.id, true); });
  hit = hitText('☒');
  assert(hit.control.checkbox.checked === true && template.compare(hit.range.end, template.find('☒')[0].end) === 0, '按事件 id 切换后，新的点击报告状态与范围');
  template.undo();
  assert(hitText('☐').control.checkbox.checked === false, '撤销刷新控件事件状态');
  template.redo();
  assert(hitText('☒').control.checkbox.checked === true, '重做刷新控件事件状态');
  template.bindings.set('applicant', '新申请人').apply();
  hit = hitText('新申请人');
  assert(template.compare(hit.range.end, template.find('新申请人')[0].end) === 0, '文字填充后范围跟着新 run 与新长度走');
  const beforeRight = controls.length;
  fire(template.find('新申请人')[0], 2);
  assert(controls.length === beforeRight, '右键不派发控件点击');
  const textNode = tv.root.querySelector('[data-text-layer="true"] text');
  const nativeSelection = document.getSelection();
  const nativeRange = document.createRange();
  nativeRange.selectNodeContents(textNode);
  nativeSelection.addRange(nativeRange);
  assert(!nativeSelection.isCollapsed && tv.root.contains(nativeSelection.anchorNode), '拖选回归确实建立常驻文字层的原生选区');
  fire(template.find('新申请人')[0]);
  assert(controls.length === beforeRight, '预览态原生拖选结束不派发控件点击');
  nativeSelection.removeAllRanges();
  controlSub.dispose();
  fire(template.find('新申请人')[0]);
  assert(controls.length === beforeRight, '取消订阅后不再收到控件点击');
  tv.dispose();
  const editTemplate = template.mount('#host', { mode: 'edit', virtualize: false });
  await frame();
  const editClicks = [];
  editTemplate.on('click:element', (e) => editClicks.push(e));
  const editRange = template.find('新申请人')[0];
  const editRect = editTemplate.rectsOf(editRange)[0];
  const editClick = () => {
    const x = editRect.x + editRect.width / 2;
    const y = editRect.y + editRect.height / 2;
    document.elementFromPoint(x, y).dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: x, clientY: y }));
  };
  editTemplate.select({ start: editRange.start, end: editRange.start });
  editClick();
  assert(editClicks.length === 1 && editClicks[0].control.tag === 'applicant', '编辑态折叠光标也报告控件点击');
  editTemplate.select(editRange);
  editClick();
  assert(editClicks.length === 1, '编辑态拖选不报告控件点击');
  // 内容锁在事务层检查，浏览器输入、IME 与快捷键共用同一条回滚路径。
  const lockedRange = template.find('内层文字')[0];
  editTemplate.select({ start: lockedRange.end, end: lockedRange.end });
  editTemplate.focus();
  const lockedInput = document.querySelector('#host textarea');
  const lockedStatus = () => host.querySelector('[role="status"]').textContent;
  let lockedChanges = 0;
  const lockedSub = template.on('document:change', () => lockedChanges++);
  lockedInput.dispatchEvent(new InputEvent('beforeinput', { inputType: 'insertText', data: '不可写', bubbles: true, cancelable: true }));
  assert(lockedStatus().includes('锁定') && template.find('不可写').length === 0, 'beforeinput 不能绕过继承的内容锁，状态区说明拒绝原因');
  assert(editTemplate.selection.start.nodeId === lockedRange.end.nodeId && editTemplate.selection.start.offset === lockedRange.end.offset, '输入拒绝后光标保持原位');
  lockedInput.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
  lockedInput.dispatchEvent(new CompositionEvent('compositionend', { data: '拒绝组合', bubbles: true }));
  assert(lockedStatus().includes('锁定') && template.find('拒绝组合').length === 0, 'IME 提交不能改锁定内容');
  editTemplate.select(lockedRange);
  lockedInput.dispatchEvent(new InputEvent('beforeinput', { inputType: 'deleteContentBackward', bubbles: true, cancelable: true }));
  assert(template.find('内层文字').length === 1 && lockedStatus().includes('锁定'), '选区删除不能绕过锁');
  assert(lockedChanges === 0, '锁定操作失败不派发文档变更');
  const shellRange = template.find('外壳锁')[0];
  editTemplate.select({ start: shellRange.end, end: shellRange.end });
  lockedInput.dispatchEvent(new InputEvent('beforeinput', { inputType: 'insertText', data: '可写', bubbles: true, cancelable: true }));
  assert(template.find('外壳锁可写').length === 1 && lockedChanges === 1 && lockedStatus() === '', '外壳锁允许输入，成功编辑清拒绝提示');
  template.undo();
  assert(template.find('外壳锁可写').length === 0 && template.find('内层文字').length === 1, '锁旁编辑撤销不触碰受保护文字');
  template.redo();
  assert(template.find('外壳锁可写').length === 1, '失败输入没有污染后续重做');
  const lockedAgain = await UltimateWord.load(await template.toDocx());
  assert(lockedAgain.bindings.list().find((b) => b.key === 'inner').locked && lockedAgain.find('内层文字').length === 1, '导出再加载保留继承锁与原内容');
  assert(lockedAgain.replaceAll('内层文字', '不可换').skipped === 1, '全部替换跳过锁定命中');
  lockedSub.dispose();
  editTemplate.dispose();
  const shellDoc = await UltimateWord.load(shellControlDocx());
  const shellView = shellDoc.mount('#host', { mode: 'edit', virtualize: false });
  await frame();
  const blockRange = shellDoc.find('块内文字')[0];
  shellView.select({ start: blockRange.start, end: blockRange.start });
  shellView.focus();
  const shellInput = host.querySelector('textarea');
  const shellStatus = () => host.querySelector('[role="status"]')?.textContent ?? '';
  let shellEvents = 0;
  const shellSub = shellDoc.on('document:change', () => shellEvents++);
  shellInput.dispatchEvent(new InputEvent('beforeinput', { inputType: 'deleteContentBackward', bubbles: true, cancelable: true }));
  assert(shellStatus().includes('锁定了外壳') && shellDoc.find('块内文字').length === 1, '块级外壳首字前退格拒绝合段并提示');
  assert(shellEvents === 0 && !shellDoc.canUndo, '外壳删除失败不派发变更也不产生撤销');
  assert(shellDoc.compare(shellView.selection.start, blockRange.start) === 0, '外壳删除失败保留光标位置');
  shellInput.dispatchEvent(new InputEvent('beforeinput', { inputType: 'insertText', data: '新', bubbles: true, cancelable: true }));
  assert(shellDoc.find('新块内文字').length === 1 && shellEvents === 1 && shellStatus() === '', '外壳内部仍可输入并清拒绝提示');
  shellDoc.undo();
  assert(shellDoc.find('新块内文字').length === 0 && shellDoc.bindings.list().some((b) => b.key === 'blockShell'), '内部输入可撤销，外壳仍在');
  shellDoc.redo();
  assert(shellDoc.find('新块内文字').length === 1, '外壳保护不破坏内部输入重做');
  shellDoc.bindings.set('outerShell', '覆盖');
  let shellRejected = false;
  try { shellDoc.bindings.apply(); } catch (e) { shellRejected = e.message.includes('锁定了外壳'); }
  assert(shellRejected && shellDoc.bindings.pending.get('outerShell') === '覆盖', '外层填充不能清掉锁定行内外壳，失败保留待填值');
  shellDoc.bindings.discard();
  const shellAgain = await UltimateWord.load(await shellDoc.toDocx());
  assert(shellAgain.find('新块内文字').length === 1 && shellAgain.bindings.list().some((b) => b.key === 'inlineShell'), '导出再加载保留编辑结果与两类外壳');
  shellAgain.bindings.set('outerShell', '覆盖');
  let shellAgainRejected = false;
  try { shellAgain.bindings.apply(); } catch (e) { shellAgainRejected = e.message.includes('锁定了外壳'); }
  assert(shellAgainRejected, '导出再加载仍保护嵌套行内外壳');
  shellSub.dispose();
  shellView.dispose();
  const dateDoc = await UltimateWord.load(dateControlDocx());
  const dateView = dateDoc.mount('#host', { virtualize: false });
  await frame();
  const dateHits = [];
  dateView.on('click:element', (e) => dateHits.push(e));
  dateDoc.bindings.set('issued', { date: '2026-10-13' }).apply();
  await frame();
  const dateRange = dateDoc.find('2026年10月13日')[0];
  assert(dateRange !== undefined && dateView.rectsOf(dateRange).length > 0, '日期填写后显示文字可查找与定位');
  assert(dateView.root.textContent.includes('2026年10月13日'), '日期显示同步到常驻文字层');
  const dateRect = dateView.rectsOf(dateRange)[0];
  const dx = dateRect.x + dateRect.width / 2;
  const dy = dateRect.y + dateRect.height / 2;
  document.elementFromPoint(dx, dy).dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: dx, clientY: dy }));
  assert(dateHits.at(-1).control.date.fullDate === '2026-10-13T00:00:00Z', '日期点击事件给当前日期属性');
  dateDoc.undo();
  await frame();
  assert(dateDoc.find('某日').length === 1 && dateDoc.bindings.list()[0].fullDate === undefined, '日期撤销恢复占位文字与属性');
  dateDoc.redo();
  await frame();
  assert(dateDoc.find('2026年10月13日').length === 1 && dateDoc.bindings.list()[0].fullDate === '2026-10-13T00:00:00Z', '日期重做同步文字与属性');
  const dateAgain = await UltimateWord.load(await dateDoc.toDocx());
  assert(dateAgain.bindings.list()[0].fullDate === '2026-10-13T00:00:00Z' && dateAgain.find('2026年10月13日').length === 1, '浏览器导出再加载保留日期');
  dateDoc.tx((t) => { t.insertText(dateDoc.find('2026年10月13日')[0].end, '待确认'); });
  await frame();
  assert(dateDoc.bindings.list()[0].fullDate === undefined && dateView.root.textContent.includes('待确认'), '日期自由编辑清旧日期并更新文字层');
  const editedDateRect = dateView.rectsOf(dateDoc.find('2026年10月13日待确认')[0])[0];
  const edx = editedDateRect.x + editedDateRect.width / 2;
  const edy = editedDateRect.y + editedDateRect.height / 2;
  document.elementFromPoint(edx, edy).dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: edx, clientY: edy }));
  assert(dateHits.at(-1).control.date.fullDate === undefined, '日期自由编辑后的点击不报告旧日期');
  dateDoc.undo();
  assert(dateDoc.bindings.list()[0].fullDate === '2026-10-13T00:00:00Z', '日期自由编辑撤销恢复属性');
  dateDoc.redo();
  assert(dateDoc.bindings.list()[0].fullDate === undefined, '日期自由编辑重做清属性');

    assert(d.bindings.list()[0].value === '甲\n乙', '一次重做重新覆盖边界空段');
    const again = await UltimateWord.load(await d.toDocx());
    assert(again.bindings.list()[0].value === '甲\n乙', '表格内空段覆盖与导出回读一致');
    v.dispose();
  }
  for (const block of [false, true]) {
    const d = await UltimateWord.load(emptyPlaceholderDocx(block));
    const v = d.mount('#host', { mode: 'edit', virtualize: false });
    await frame();
    let changes = 0;
    d.on('document:change', () => changes++);
    d.bindings.set('field', '').apply();
    const empty = d.bindings.list()[0];
    assert(!empty.placeholder && !empty.dataBound && empty.value === '', '填空清占位与绑定，保留空文字槽');
    assert(d.query('run')[0].props.bold && !d.query('run')[0].props.styleId && !d.query('run')[0].props.color, '空文字槽使用控件格式并清灰色占位样式');
    assert(v.caretRect(empty.range.start) !== null, '填空后的插入点仍可定位');
    v.select(empty.range);
    v.focus();
    const input = host.querySelector('textarea');
    if (block) {
      input.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true }));
      input.dispatchEvent(new CompositionEvent('compositionend', { data: '张三', bubbles: true }));
    } else {
      input.dispatchEvent(new InputEvent('beforeinput', { inputType: 'insertText', data: '张三', bubbles: true, cancelable: true }));
    }
    await frame();
    const run = d.query('run')[0];
    assert(d.bindings.list()[0].value === '张三' && run.props.bold && !run.props.italic && !run.props.color, '填空后输入与 IME 继承控件格式');
    const glyph = v.root.querySelector(`text[data-run="${run.id}"]`);
    assert(glyph?.getAttribute('font-weight') === 'bold' && !glyph.hasAttribute('font-style') && glyph.getAttribute('fill') === '#000000', '重新输入的字形显示为加粗黑字');
    assert(v.root.textContent.includes('张三') && v.rectsOf(d.find('张三')[0]).length > 0, '重新输入刷新文字层并能定位');
    d.undo();
    d.bindings.set('field', '').apply();
    assert(changes === 3 && d.canRedo, '空值重复提交不派事件并保留输入重做');
    d.undo();
    assert(d.bindings.list()[0].placeholder && d.query('run')[0].props.styleId === 'PlaceholderText', '再撤销恢复原占位格式与状态');
    d.redo();
    d.redo();
    const again = await UltimateWord.load(await d.toDocx());
    assert(again.bindings.list()[0].value === '张三' && again.query('run')[0].props.bold && !again.query('run')[0].props.italic, '重做与导出回读保留控件格式');
    v.dispose();
  }
  for (const [scope, revision] of [['paragraph', 'del'], ['row', 'ins'], ['row', 'del'], ['outerRow', 'ins'], ['outerRow', 'del']]) {
    for (const type of ['date', 'checkbox']) {
      for (const revisions of ['final', 'original', 'markup']) {
        const d = await UltimateWord.load(markRevisionControlDocx(type, scope, revision), { revisions });
        const v = d.mount('#host', { mode: 'edit', virtualize: false });
        await frame();
        const before = d.bindings.list()[0];
        const selection = v.selection;
        const text = v.root.textContent;
        let changes = 0;
        d.on('document:change', () => changes++);
        const value = type === 'date' ? { date: '2026-10-14' } : true;
        d.bindings.set('field', value);
        let error;
        try { d.bindings.apply(); } catch (e) { error = e; }
        assert(/无修订/.test(error?.message), '日期与复选框不能绕过段落标记或祖先行修订');
        assert(changes === 0 && !d.canUndo && d.bindings.pending.has('field'), '失败保留待填值与历史，不派发变更');
        assert(JSON.stringify(d.bindings.list()[0]) === JSON.stringify(before) && JSON.stringify(v.selection) === JSON.stringify(selection) && v.root.textContent === text, '三种修订视图下失败保留控件状态、选区与文字层');
        const again = await UltimateWord.load(await d.toDocx(), { revisions });
        assert(JSON.stringify(again.bindings.list()[0]) === JSON.stringify(before), '拒绝填写后导出回读保留原日期、勾选与绑定');
        v.dispose();
      }
    }
  }
  for (const scope of ['inline', 'inlinePrefix', 'nestedBlock', 'mixed']) {
    const d = await UltimateWord.load(nestedControlDocx(scope));
    const v = d.mount('#host', { mode: 'edit', virtualize: false });
    const before = d.bindings.list();
    v.select(d.find('原值')[0]);
    let changes = 0;
    let layouts = 0;
    d.on('document:change', () => changes++);
    d.on('layout:done', () => layouts++);
    d.bindings.setMany({ outer: '最终值', inner: '子更新', middle: '中层更新', neighbor: '邻居更新' });
    d.bindings.apply();
    await frame();
    const after = d.bindings.list();
    const outer = after.find((b) => b.key === 'outer');
    assert(changes === 1 && layouts === 1 && d.bindings.pending.size === 0, '嵌套批量填写只派发一次变更与重排并清空待填值');
    assert(after.length === 2 && outer.value === '最终值' && after.find((b) => b.key === 'neighbor').value === '邻居更新', '按父链先填子再填父，最终只留下外层与相邻控件');
    assert(v.rectsOf(outer.range).length > 0 && v.root.textContent.includes('最终值') && !v.root.textContent.includes('子更新') && !v.root.textContent.includes('中层更新'), '覆盖后的文字层与定位同步刷新');
    d.undo();
    assert(JSON.stringify(d.bindings.list()) === JSON.stringify(before) && !d.canUndo, '一次撤销恢复全部父子控件与相邻字段');
    d.redo();
    assert(JSON.stringify(d.bindings.list()) === JSON.stringify(after), '一次重做恢复批量填写结果');
    const again = await UltimateWord.load(await d.toDocx());
    assert(JSON.stringify(again.bindings.list().map((b) => [b.key, b.value])) === JSON.stringify(after.map((b) => [b.key, b.value])), '嵌套批量填写导出回读不恢复已移除子外壳');
    v.dispose();
    for (const lock of ['sdtLocked', 'contentLocked']) {
      const d = await UltimateWord.load(nestedControlDocx(scope, lock));
      d.bindings.set('neighbor', '历史值').apply();
      d.undo();
      const v = d.mount('#host', { mode: 'edit', virtualize: false });
      v.select(d.find('原值')[0]);
      const before = d.bindings.list();
      const selection = JSON.stringify(v.selection);
      const text = v.root.textContent;
      let changes = 0;
      d.on('document:change', () => changes++);
      d.bindings.setMany({ inner: '子更新', outer: '覆盖', neighbor: '邻居更新' });
      let error;
      try { d.bindings.apply(); } catch (e) { error = e; }
      assert(/锁定/.test(error?.message) && changes === 0, '父链排序仍执行子控件内容锁与外壳锁检查，失败不派事件');
      assert(JSON.stringify(d.bindings.list()) === JSON.stringify(before) && d.bindings.pending.size === 3, '嵌套填写失败整批回滚并保留全部待填值');
      assert(JSON.stringify(v.selection) === selection && v.root.textContent === text, '失败保留原选区与文字层');
      const canRedo = d.canRedo;
      d.redo();
      assert(canRedo && d.bindings.list().find((b) => b.key === 'neighbor').value === '历史值', '失败保留已有重做历史');
      v.dispose();
    }
  }
  for (const scope of ['inline', 'inlinePrefix', 'nestedBlock', 'mixed']) {
    const d = await UltimateWord.load(nestedControlDocx(scope));
    const initial = d.bindings.list();
    const outer = initial.find((b) => b.key === 'outer');
    const neighbor = initial.find((b) => b.key === 'neighbor');
    d.bindings.setMany({ neighbor: '邻居更新', inner: '子更新' });
    const pending = JSON.stringify([...d.bindings.pending]);
    d.tx((t) => { t.fillContentControl(outer.id, '覆盖'); });
    d.undo();
    d.redo();
    d.tx((t) => { t.fillContentControl(neighbor.id, '历史值'); });
    d.undo();
    const v = d.mount('#host', { mode: 'edit', virtualize: false });
    v.select(d.find('覆盖')[0]);
    const before = JSON.stringify(d.bindings.list());
    const selection = JSON.stringify(v.selection);
    const text = v.root.textContent;
    let changes = 0;
    let layouts = 0;
    d.on('document:change', () => changes++);
    d.on('layout:done', () => layouts++);
    let error;
    try { d.bindings.apply(); } catch (e) { error = e; }
    assert(error instanceof RangeError && error.message.includes('inner'), '暂存后字段被编辑或重做移除，提交明确报告缺失名字');
    assert(changes === 0 && layouts === 0 && JSON.stringify(d.bindings.list()) === before, '缺失字段阻止整批提交，不改有效字段且不派发变更或重排');
    assert(JSON.stringify([...d.bindings.pending]) === pending, '提交缺失字段保留全部待填数据');
    assert(JSON.stringify(v.selection) === selection && v.root.textContent === text, '缺失字段提交失败保留选区与文字层');
    const again = await UltimateWord.load(await d.toDocx());
    assert(JSON.stringify(again.bindings.list().map((b) => [b.key, b.value])) === JSON.stringify(d.bindings.list().map((b) => [b.key, b.value])), '拒绝缺失字段后导出回读保持原文');
    const canRedo = d.canRedo;
    d.redo();
    assert(canRedo && d.bindings.list().find((b) => b.key === 'neighbor').value === '历史值', '缺失字段失败保留已有重做历史');
    d.undo();
    d.undo();
    assert(JSON.stringify(d.bindings.list()) === JSON.stringify(initial) && JSON.stringify([...d.bindings.pending]) === pending, '撤销恢复被移除字段，待填值仍可重试');
    changes = 0;
    layouts = 0;
    d.bindings.apply();
    const after = d.bindings.list();
    const inner = after.find((b) => b.key === 'inner');
    assert(changes === 1 && layouts === 1 && d.bindings.pending.size === 0 && inner.value === '子更新' && after.find((b) => b.key === 'neighbor').value === '邻居更新', '恢复字段后重试一次提交全部暂存值');
    assert(v.root.textContent.includes('子更新') && v.root.textContent.includes('邻居更新') && v.rectsOf(inner.range).length > 0, '重试成功后文字层与定位同步更新');
    d.undo();
    assert(JSON.stringify(d.bindings.list()) === JSON.stringify(initial), '重试后的填写仍是一个撤销单元');
    d.redo();
    assert(JSON.stringify(d.bindings.list()) === JSON.stringify(after), '重做恢复重试填写结果');
    v.dispose();
  }
  result.textContent = `PASS: ${passed} browser assertions`;
} catch (error) {
  result.textContent = `FAIL after ${passed}: ${error.message}`;
  console.error(error);
}
</script>
