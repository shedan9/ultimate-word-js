<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>打印回归</title>
<style>
/* 故意摆成应用壳的惯用布局：body 钉成一屏高 + overflow:hidden，文档住在一个小滚动容器里 ——
   原地打印在这种布局下只印得出第一屏，按文档印必须不受它影响 */
html, body { margin: 0; height: 100%; overflow: hidden; }
#app { display: flex; height: 100%; }
#side { width: 200px; background: #eee; }
#result { position: fixed; top: 0; left: 0; z-index: 20; background: white; margin: 0; }
#host { flex: 1; overflow: auto; padding: 16px; }
</style>
<div id="app"><div id="side"><pre id="result">正在验证…</pre></div><div id="host"></div></div>
<script type="module">
import { UltimateWord } from 'ultimate-word';

// `?fixture=名字` 换样本（默认 spike-page-01，22 页）；外部的 printToPDF 检查拿 gongwen-01 与真值比坐标
const fixtures = import.meta.glob('../../fidelity/fixtures/*.docx', { query: '?url', import: 'default' });
const name = new URLSearchParams(location.search).get('fixture') ?? 'spike-page-01';
const fixtureUrl = await fixtures[`../../fidelity/fixtures/${name}.docx`]();

const host = document.querySelector('#host');
const result = document.querySelector('#result');
let passed = 0;
const assert = (condition, label) => { if (!condition) throw new Error(label); passed++; };
const sheet = () => document.body.querySelector(':scope > [data-uw-print]');
try {
  const doc = await UltimateWord.load(fixtureUrl);
  assert(doc.pageCount >= 1, `${name}：${doc.pageCount} 页`);
  const view = doc.mount(host, { zoom: 0.5 });
  window.__doc = doc; window.__view = view;
  const paper = doc.layout.pages[0].geometry;
  // ① Ctrl+P（beforeprint）：body 直下多出一张打印页，页数 = 文档页数，尺寸 = 纸张 pt
  window.dispatchEvent(new Event('beforeprint'));
  const pages = sheet()?.querySelectorAll('.uw-print-page') ?? [];
  assert(pages.length === doc.pageCount, `打印页有 ${pages.length} 页`);
  assert(pages[0].style.width === `${Math.round(paper.width / 20 * 100) / 100}pt`, '页盒宽 = 纸宽（pt）');
  assert(pages[0].querySelector('svg') !== null && pages[pages.length - 1].querySelector('svg text') !== null, '每页都重画了（最后一页也有字）');
  assert(getComputedStyle(sheet()).display === 'none', '屏幕上看不见打印页');
  assert(host.querySelectorAll('[data-rendered="true"]').length < doc.pageCount, '屏幕上的一份没有被迫全量补画');
  // ② 缩放不影响打印页：它按 zoom = 1 画，尺寸只认纸张
  view.setZoom(2);
  assert(pages[0].style.width === `${Math.round(paper.width / 20 * 100) / 100}pt`, '屏幕缩放不改打印页尺寸');
  window.dispatchEvent(new Event('afterprint'));
  assert(sheet() === null, 'afterprint 拆掉打印页');
  // ③ 两个视图同挂：只造一张打印页
  const second = document.createElement('div'); document.body.append(second);
  const thumbs = doc.mount(second, { zoom: 0.2, textLayer: false });
  window.dispatchEvent(new Event('beforeprint'));
  assert(document.body.querySelectorAll(':scope > [data-uw-print]').length === 1, '两个视图只造一张打印页');
  window.dispatchEvent(new Event('afterprint'));
  thumbs.dispose(); second.remove();
  // ④ print()：走 window.print（桩），不看 printMode
  view.dispose();
  const inline = doc.mount(host, { printMode: 'inline' });
  const nativePrint = window.print; let printed = 0;
  window.print = () => { printed++; window.dispatchEvent(new Event('beforeprint')); assert(sheet() !== null, 'print() 造了打印页'); window.dispatchEvent(new Event('afterprint')); };
  inline.print();
  window.print = nativePrint;
  assert(printed === 1 && sheet() === null, 'print() 走了 window.print 且拆干净');
  window.dispatchEvent(new Event('beforeprint'));
  assert(sheet() === null && inline.root.querySelectorAll('[data-rendered="true"]').length === doc.pageCount, 'inline 模式的 Ctrl+P 原地补画');
  window.dispatchEvent(new Event('afterprint'));
  inline.dispose();
  // ⑤ toPNG：按 scale 出纸张尺寸的位图，与屏幕缩放无关；页里真画了字；越界抛 RangeError
  const shot = doc.mount(host, { zoom: 0.3 });
  const blob = await shot.toPNG(0, { scale: 2 });
  assert(blob.type === 'image/png', `toPNG 出 PNG（${blob.type}）`);
  const bitmap = await createImageBitmap(blob);
  const px = (tw, s) => Math.round(tw / 1440 * 96 * s);
  assert(bitmap.width === px(paper.width, 2) && bitmap.height === px(paper.height, 2), `尺寸 = 纸张 × scale（${bitmap.width}×${bitmap.height}）`);
  const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
  const g = canvas.getContext('2d'); g.drawImage(bitmap, 0, 0);
  const data = g.getImageData(0, 0, bitmap.width, bitmap.height).data;
  let dark = 0, clear = 0;
  for (let i = 0; i < data.length; i += 4) { if (data[i] < 128) dark++; if (data[i + 3] < 255) clear++; }
  assert(dark > 1000, `页里画出了字（${dark} 个深色像素）`);
  assert(clear === 0, `纸是不透明的（${clear} 个透明像素）`);
  const one = await createImageBitmap(await shot.toPNG(doc.pageCount - 1));
  assert(one.width === px(doc.layout.pages[doc.pageCount - 1].geometry.width, 1), '默认 scale = 1，最后一页也能导');
  let threw = false; try { await shot.toPNG(doc.pageCount); } catch (e) { threw = e instanceof RangeError; }
  assert(threw, '页号越界抛 RangeError');
  shot.dispose();
  // ⑥ 宿主 @font-face 引进来的字体要内联进快照（图片沙箱里的 SVG 看不见宿主样式表）：
  // 同一页用「有 @font-face 的族」与「没有的族」各导一张，像素不同才说明网络字体真的画上去了
  const fontUrl = Object.values(import.meta.glob('../../fidelity/node_modules/pdfjs-dist/standard_fonts/LiberationSans-Regular.ttf', { query: '?url', import: 'default', eager: true }))[0];
  const face = document.createElement('style');
  face.textContent = `@font-face { font-family: "UwProbe"; src: url("${fontUrl}") format("truetype"); }`;
  document.head.append(face);
  // 探针字体只有拉丁字形，所以用中西混排的 gongwen-01（默认样本是纯中文，换哪个族都一样）
  const mixed = await UltimateWord.load(await fixtures['../../fidelity/fixtures/gongwen-01.docx']());
  const pixels = async (family) => {
    const v = mixed.mount(host, { fontFamily: () => `${family}, monospace` });
    const b = await createImageBitmap(await v.toPNG(0));
    v.dispose();
    const c = new OffscreenCanvas(b.width, b.height); const x = c.getContext('2d'); x.drawImage(b, 0, 0);
    return x.getImageData(0, 0, b.width, b.height).data;
  };
  const withFace = await pixels("'UwProbe'"), without = await pixels("'UwMissing'");
  let diff = 0; for (let i = 0; i < withFace.length; i += 4) if (withFace[i] !== without[i]) diff++;
  face.remove();
  assert(diff > 100, `@font-face 字体内联进了快照（${diff} 个像素不同）`);
  // 留一个视图给外部的 printToPDF 检查用
  window.__view = doc.mount(host, { zoom: 0.5 });
  result.textContent = `PASS: ${passed} print browser assertions`;
} catch (error) {
  result.textContent = `FAIL after ${passed}: ${error.stack}`;
}
</script>
</html>
